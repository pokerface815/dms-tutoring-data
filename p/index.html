<style>
  :root {
    --bg: #f5f7f9;
    --surface: #ffffff;
    --surface2: #eef1f4;
    --border: #dfe5ea;
    --text: #1c2530;
    --text2: #4d5a65;
    --text3: #8b98a5;
    --accent: #2f4f6b;
    --accent-light: #5578a0;
    --accent-dark: #223a51;
    --purple: #6a4cb1;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;  /* 모바일 좌우 스크롤 방지 */
  }
  body { max-width: 680px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; }
  .header {
    background: var(--surface);
    padding: 20px;
    border-bottom: 0.5px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .header-brand { font-family: 'Noto Sans KR', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -0.3px; text-align: center; }
  .header-tagline { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; color: var(--text3); text-align: center; margin-top: 2px; }
  .student-banner {
    margin: 16px 20px 4px;
    padding: 16px 20px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
  }
  .student-name { font-size: 18px; font-weight: 700; }
  .student-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }

  .content { padding: 8px 20px 40px; }
  .month-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .month-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
  }
  .month-header:hover { background: var(--surface2); }
  .month-title { font-size: 15px; font-weight: 700; }
  .month-count { font-size: 12px; color: var(--text3); margin-left: 8px; font-weight: 400; }
  .month-rate { font-size: 11px; color: var(--purple); margin-left: 8px; font-weight: 700; background: #f3effa; padding: 2px 8px; border-radius: 10px; }
  .rate-box { padding: 12px 14px; background: #f6f2fb; border-radius: 10px; margin: 10px 0 4px; }
  .rate-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text2); margin-bottom: 8px; }
  .rate-top b { color: var(--purple); font-size: 16px; }
  .rate-track { height: 8px; background: #e3d9f3; border-radius: 4px; overflow: hidden; }
  .rate-fill { height: 100%; background: var(--purple); border-radius: 4px; transition: width 0.3s; }
  .rate-sub { font-size: 11px; color: var(--text3); margin-top: 6px; }
  /* 회차별 오답노트 진행률 */
  .stage-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .stage-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .stage-label {
    flex-shrink: 0; width: 28px; text-align: center;
    background: #e3d9f3; color: #6a4cb1; font-weight: 700;
    padding: 2px 0; border-radius: 5px; font-size: 11px;
  }
  .stage-track { flex: 1; height: 7px; background: #e3d9f3; border-radius: 4px; overflow: hidden; }
  .stage-fill { height: 100%; background: var(--purple); border-radius: 4px; transition: width 0.3s; }
  .stage-text { flex-shrink: 0; font-size: 11px; color: var(--text2); min-width: 36px; text-align: right; }
  /* 회차별 보기 토글 (details/summary) */
  .stage-toggle {
    margin-top: 10px;
    border-top: 1px dashed var(--border);
    padding-top: 8px;
  }
  .stage-toggle summary {
    font-size: 12px;
    color: var(--text2);
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    padding: 2px 0;
    user-select: none;
  }
  .stage-toggle summary::-webkit-details-marker { display: none; }
  .stage-toggle summary::before {
    content: '▶';
    font-size: 9px;
    margin-right: 4px;
    transition: transform 0.2s;
    display: inline-block;
  }
  .stage-toggle[open] summary::before { transform: rotate(90deg); }

  .month-arrow { font-size: 12px; color: var(--text3); transition: transform 0.2s; }
  .month-card.open .month-arrow { transform: rotate(90deg); }
  .month-body { display: none; padding: 6px 18px 12px; }
  .month-card.open .month-body { display: block; }

  /* 수업 캘린더 */
  .lesson-cal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
  }
  .lesson-cal-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .lesson-cal-row:last-child { margin-bottom: 0; }
  .lesson-cal-head {
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    margin-bottom: 6px;
  }
  .lesson-cal-wd {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text3);
    padding: 2px 0;
  }
  .lesson-cal-day {
    text-align: center;
    font-size: 12.5px;
    padding: 8px 2px;
    border-radius: 6px;
    color: var(--text2);
    min-height: 34px;
    display: flex; align-items: center; justify-content: center;
  }
  .lesson-cal-day.empty { color: transparent; }
  .lesson-cal-day.has-lesson {
    background: #eef5e2;
    color: #2d4014;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid #c3d8a4;
  }
  .lesson-cal-day.has-lesson:hover {
    background: #d8e7be;
  }
  .lesson-cal-day.has-closed {
    background: #fee2e2;
    color: #991b1b;
    font-weight: 700;
    border: 1px solid #fca5a5;
    cursor: pointer;
  }
  .lesson-cal-day.has-closed.has-lesson { background: linear-gradient(135deg, #eef5e2 50%, #fee2e2 50%); }
  .lesson-cal-day.has-event:not(.has-closed) {
    background: #ede9fe;
    color: #4c1d95;
    font-weight: 700;
    border: 1px solid #c4b5fd;
    cursor: pointer;
  }
  .lesson-cal-day.selected {
    background: #84b96d;
    color: #fff;
    border-color: #5e8c4a;
  }
  .cal-dots {
    display: flex; gap: 2px; justify-content: center;
    position: absolute; bottom: 2px; left: 0; right: 0;
  }
  .lesson-cal-day { position: relative; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot-closed { background: #ef4444; }
  .dot-event { background: #7c5cbf; }

  /* 학원 일정 카드 (학부모) */
  .academy-event-card {
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .academy-event-card.closed { background: #fef5f5; border-color: #fca5a5; }
  .academy-event-card.event { background: #f7f4ff; border-color: #c4b5fd; }
  .lesson-cal-hint {
    font-size: 11px; color: var(--text3); text-align: center;
    margin-top: 8px; margin-bottom: 4px;
  }
  .lesson-detail { margin-top: 6px; }
  .lesson-detail:empty { display: none; }

  .lesson-item {
    padding: 14px;
    margin-bottom: 12px;
    background: var(--surface2);
    border-radius: 12px;
    border: 0.5px solid var(--border);
    border-left: 4px solid var(--accent-light);
  }
  .lesson-item:last-child { margin-bottom: 0; }
  .lesson-date {
    font-size: 14px; font-weight: 700; color: var(--accent-dark);
    margin-bottom: 8px; padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .lesson-date { /* 날짜 표시 (이모지 없음) */ }
  .lesson-class { font-size: 11px; color: var(--text3); font-weight: 400; margin-left: auto; }
  .lesson-content { font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: keep-all; }
  .lesson-task {
    margin-top: 8px; padding: 8px 12px;
    background: #f6f2fb; border-radius: 8px;
    font-size: 13px; line-height: 1.5;
  }
  .lesson-task-label { color: var(--purple); font-weight: 700; }
  /* 과제 관리에서 부여한 추가 과제 — 살짝 다른 색조 */
  .lesson-task-extra {
    background: #f0eaf7;
    margin-top: 6px;
  }
  /* 그 날 수업 일지가 없고 과제만 있는 항목 — 좌측 보더 다르게 (구분) */
  .lesson-item-asgn-only {
    border-left-color: var(--purple);
    background: #f9f7fc;
  }
  .lesson-note {
    margin-top: 8px; padding: 10px 12px;
    background: #fdf6e9; border-radius: 8px;
    font-size: 13px; line-height: 1.55;
    border-left: 3px solid var(--accent-light);

<body>
<div id="app">
  <div class="loading">불러오는 중...</div>
</div>

<script>
  // ===== 과목별 동적 색상 매핑 (학생 페이지와 동일 방식) =====
  // Material Design 200, 무지개 hue 순서대로 부드럽게 이어짐
  const SUBJECT_COLOR_PALETTE = [
    '#FFF59D', '#E6EE9C', '#C5E1A5', '#A5D6A7',
    '#80CBC4', '#80DEEA', '#81D4FA', '#90CAF9',
    '#9FA8DA', '#B39DDB', '#CE93D8', '#F48FB1',
    '#EF9A9A', '#FFAB91', '#FFCC80', '#FFE082',
  ];
  let _subjectColorMap = {};
  function rebuildSubjectColorMap(logs) {
    const firstSeen = {};
    for (const l of (logs || [])) {
      const s = (l && l.subject) ? l.subject : '';
      if (!s) continue;
      const t = l.createdAt || l.startedAt || '';
      if (!(s in firstSeen) || t < firstSeen[s]) firstSeen[s] = t;
    }
    const sorted = Object.keys(firstSeen).sort((a, b) =>
      (firstSeen[a] || '').localeCompare(firstSeen[b] || '')
    );
    _subjectColorMap = {};
    sorted.forEach((s, i) => {
      _subjectColorMap[s] = SUBJECT_COLOR_PALETTE[i % SUBJECT_COLOR_PALETTE.length];
    });
  }
  function getSubjectColor(subject) {
    const s = String(subject || '');
    if (_subjectColorMap[s]) return _subjectColorMap[s];
    const usedCount = Object.keys(_subjectColorMap).length;
    const color = SUBJECT_COLOR_PALETTE[usedCount % SUBJECT_COLOR_PALETTE.length];
    _subjectColorMap[s] = color;
    return color;
  }

  let parentCode = '';
  let parentData = null;

  (async function() {
    const params = new URLSearchParams(window.location.search);
    parentCode = (params.get('code') || '').trim();
    if (!parentCode) { renderError('코드가 없습니다', '올바른 URL로 접속해주세요.'); return; }
    if (!/^[a-z0-9]{6,20}$/.test(parentCode)) { renderError('잘못된 코드', '올바른 URL로 접속해주세요.'); return; }

    try {
      const url = `../parents/${parentCode}.json?t=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) {
        if (res.status === 404) renderError('페이지를 찾을 수 없습니다', 'URL이 정확한지 확인해주세요.<br>문제가 계속되면 선생님께 문의하세요.');
        else renderError('데이터 로드 실패', `오류 코드: ${res.status}`);
        return;
      }
      parentData = await res.json();
      // 과목 색 매핑 초기화 (학생의 학습 기록 기준)
      try { rebuildSubjectColorMap((parentData && parentData.effortLogs) || []); } catch(e) {}
      renderPage();
    } catch (e) {
      console.error(e);
      renderError('네트워크 오류', '인터넷 연결을 확인해주세요.<br>' + e.message);
    }
  })();

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function renderError(title, msg) {
    document.getElementById('app').innerHTML = `
      <div class="header">
        <div class="header-brand">생각의 흐름 · 기억의 설계</div>
        <div class="header-tagline">잊지 않게 만드는 수학 학습</div>
      </div>
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <h3 style="margin-bottom:8px;">${title}</h3>
        <p style="font-size:13px; line-height:1.6;">${msg}</p>
      </div>
    `;
  }

  function formatRelativeTime(date) {
    const diff = Date.now() - date.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return '방금 전';
    if (mins < 60) return `${mins}분 전`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}시간 전`;
    const d = Math.floor(hrs / 24);
    return `${d}일 전`;
  }

  function renderPage() {
    const d = parentData;
    const student = d.student || {};
    const months = d.months || [];

    let html = `
      <div class="header">
        <div class="header-brand">생각의 흐름 · 기억의 설계</div>
        <div class="header-tagline">잊지 않게 만드는 수학 학습</div>
      </div>
      <div class="student-banner">
        <div class="student-name">${escapeHtml(student.name || '')} 학생</div>
        <div class="student-sub">학습 안내 · 수업 내용을 월별로 확인하실 수 있습니다</div>
      </div>
      <div class="content">
    `;

    // 학습 기록 (노력의 자취) — 부모 공유가 ON이고 데이터가 있을 때만 (최상단)
    const effort = d.effortLogs;
    if (effort && effort.enabled) {
      html += renderEffortSection(effort);
    }

    // 테스트 결과 섹션 (있을 때만) — 아코디언, 기본 닫힘
    const tests = d.tests || [];
    if (tests.length > 0) {
      const INITIAL = 8;
      const recent = tests.slice(0, INITIAL);
      const rest = tests.slice(INITIAL);
      html += `
        <div class="month-card">
          <div class="month-header" onclick="this.parentElement.classList.toggle('open')">
            <div><span class="month-title">테스트 결과</span><span class="month-count">${tests.length}개</span></div>
            <span class="month-arrow">▶</span>
          </div>
          <div class="month-body">
            <div id="testRecent">${recent.map(renderTestItem).join('')}</div>
            ${rest.length > 0 ? `
              <div id="testRest" style="display:none;">${rest.map(renderTestItem).join('')}</div>
              <button class="test-more-btn" id="testMoreBtn" onclick="toggleTestMore()">+ 이전 결과 ${rest.length}개 더 보기</button>
            ` : ''}
          </div>
        </div>
      `;
    }

    if (months.length === 0) {
      html += `
        <div class="empty-state">
          <div class="icon">📘</div>
          <h3 style="margin-bottom:8px;">아직 등록된 수업 내용이 없습니다</h3>
          <p style="font-size:13px;">수업이 진행되면 이곳에 안내됩니다.</p>
        </div>
      `;
    } else {
      months.forEach((m, idx) => {
        // 모든 달 기본 닫힘 (사용자가 클릭해서 펼침)
        const openClass = '';
        const rate = m.completionRate;
        const rateBadge = rate ? `<span class="month-rate">과제 ${rate.done}/${rate.total} · ${rate.percent}%</span>` : '';
        const rateBar = rate ? `
          <div class="rate-box">
            <div class="rate-top"><span>이번 달 과제 완료율</span><b>${rate.percent}%</b></div>
            <div class="rate-track"><div class="rate-fill" style="width:${rate.percent}%;"></div></div>
            <div class="rate-sub">${rate.done}건 완료 / ${rate.total}건 (마감 지난 과제 기준)</div>
          </div>
        ` : '';
        // 오답노트 — 전체 완료율 + 회차별 토글
        const stages = m.noteStages;
        let stagesBar = '';
        if (stages) {
          let totalDone = 0, totalAll = 0;
          const rows = [1,2,3,4].map(st => {
            const s = stages[st];
            if (!s || s.total === 0) return '';
            totalDone += s.done;
            totalAll += s.total;
            return `
              <div class="stage-row">
                <span class="stage-label">${st}차</span>
                <div class="stage-track"><div class="stage-fill" style="width:${s.percent}%;"></div></div>
                <span class="stage-text">${s.done}/${s.total}</span>
              </div>
            `;
          }).filter(Boolean).join('');
          if (rows) {
            const overallPct = totalAll > 0 ? Math.round(totalDone / totalAll * 100) : 0;
            stagesBar = `
              <div class="rate-box">
                <div class="rate-top"><span>이번 달 오답노트 완료율</span><b>${overallPct}%</b></div>
                <div class="rate-track"><div class="rate-fill" style="width:${overallPct}%;"></div></div>
                <div class="rate-sub">${totalDone}건 완료 / ${totalAll}건 (마감 지난 회차 기준)</div>
                <details class="stage-toggle">
                  <summary>회차별로 보기</summary>
                  <div class="stage-list">${rows}</div>
                </details>
              </div>
            `;
          }
        }
        // 수업일지 — 캘린더 + 클릭으로 상세 펼침
        const lessonsCalendar = renderMonthCalendar(m, idx);
        html += `
          <div class="month-card${openClass}">
            <div class="month-header" onclick="this.parentElement.classList.toggle('open')">
              <div><span class="month-title">${escapeHtml(m.label)}</span><span class="month-count">수업 ${m.lessons.length}회</span>${rateBadge}</div>
              <span class="month-arrow">▶</span>
            </div>
            <div class="month-body">
              ${rateBar}
              ${stagesBar}
              ${lessonsCalendar}
            </div>
          </div>
        `;
      });
    }

    const updatedTime = d.generatedAt ? new Date(d.generatedAt) : null;
    html += `
        <div class="footer">
          <button class="refresh-btn" onclick="location.reload()">🔄 새로고침</button>
          ${updatedTime ? `<span class="last-updated">마지막 업데이트: ${formatRelativeTime(updatedTime)}</span>` : ''}
        </div>
      </div>
    `;
    document.getElementById('app').innerHTML = html;
  }

  function toggleTestMore() {
    const rest = document.getElementById('testRest');
    const btn = document.getElementById('testMoreBtn');
    if (!rest || !btn) return;
    if (rest.style.display === 'none') {
      rest.style.display = 'block';
      btn.style.display = 'none';
    }
  }

  // ===== 학습 기록 (노력의 자취) =====
  function renderEffortSection(effort) {
    const summary = effort.summary || {};
    const logs = (effort.logs || []).slice().sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));

    const todaySec = summary.todaySec || 0;
    const weekSec = summary.weekSec || 0;
    const monthSec = summary.monthSec || 0;
    const streak = summary.streak || 0;

    const headerSummary = weekSec > 0
      ? `이번 주 ${fmtEffortDuration(weekSec)}`
      : (logs.length > 0 ? `최근 ${logs.length}건` : '아직 기록 없음');

    // 이번 달 과목별 분포
    const bySubject = summary.bySubjectMonth || {};
    const subjectEntries = Object.entries(bySubject).sort((a, b) => b[1] - a[1]);
    const monthTotal = subjectEntries.reduce((s, [, v]) => s + v, 0) || 1;

    // 날짜별 그룹
    const byDay = {};
    for (const l of logs) {
      const d = new Date(l.startedAt || 0);
      const key = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
      if (!byDay[key]) byDay[key] = [];
      byDay[key].push(l);
    }
    const dayKeys = Object.keys(byDay).sort((a, b) => b.localeCompare(a));

    // 외곽은 평평한 섹션 (토글 없음, 항상 펼침)
    let html = `
      <div class="effort-section-card">
        <div class="effort-section-head">
          <span class="effort-section-title">학습 기록</span>
          <span class="effort-section-summary">${escapeHtml(headerSummary)}</span>
        </div>
        <div class="effort-summary-grid">
          <div class="effort-summary-stat"><div class="effort-summary-lbl">오늘</div><div class="effort-summary-val">${fmtEffortDurationShort(todaySec)}</div></div>
          <div class="effort-summary-stat"><div class="effort-summary-lbl">이번 주</div><div class="effort-summary-val">${fmtEffortDurationShort(weekSec)}</div></div>
          <div class="effort-summary-stat"><div class="effort-summary-lbl">이번 달</div><div class="effort-summary-val">${fmtEffortDurationShort(monthSec)}</div></div>
          <div class="effort-summary-stat streak"><div class="effort-summary-lbl">연속</div><div class="effort-summary-val">${streak > 0 ? `${streak}일` : '-'}</div></div>
        </div>
    `;

    if (subjectEntries.length > 0) {
      html += `
        <div class="effort-subj-box">
          <div class="effort-subj-box-title">이번 달 과목별 학습</div>
          ${renderParentPieChart(subjectEntries, monthTotal)}
        </div>
      `;
    }

    // 최근 학습 기록 — 내부 토글 (기본 닫힘)
    if (logs.length === 0) {
      html += `<div class="effort-empty-inline">아직 학습 기록이 없어요.<br>자녀가 학생 페이지의 <b>노력의 자취</b>에서<br>기록을 시작하면 여기에 나타납니다.</div>`;
    } else {
      let logsInner = '';
      for (const dk of dayKeys) {
        const dayLogs = byDay[dk];
        const dayTotal = dayLogs.reduce((s, l) => s + (l.seconds || 0), 0);
        const d = new Date(dk + 'T00:00:00');
        const dayNames = ['일','월','화','수','목','금','토'];
        const dayLabel = `${d.getMonth()+1}월 ${d.getDate()}일 (${dayNames[d.getDay()]})`;
        logsInner += `<div class="effort-day-group">
          <div class="effort-day-head">
            <span>${dayLabel}</span>
            <span class="effort-day-total">${fmtEffortDuration(dayTotal)} · ${dayLogs.length}건</span>
          </div>
          ${dayLogs.map(renderEffortLogItem).join('')}
        </div>`;
      }
      html += `
        <div class="effort-logs-toggle">
          <div class="effort-logs-toggle-head" onclick="this.parentElement.classList.toggle('open')">
            <span class="effort-logs-toggle-title">최근 학습 기록</span>
            <span class="effort-logs-toggle-count">최근 30일 · ${logs.length}건</span>
            <span class="effort-logs-toggle-arrow">▶</span>
          </div>
          <div class="effort-logs-toggle-body">${logsInner}</div>
        </div>
      `;
    }

    html += `</div>`;  // .effort-section-card
    return html;
  }

  // 버블 차트 + 범례 (d3-hierarchy packing)
  function renderParentPieChart(sortedEntries, totalSec) {
    const valid = sortedEntries.filter(([s, sec]) => sec > 0);
    if (valid.length === 0) return '';

    const size = 300;
    let svgContent = '';
    let viewBox = `0 0 ${size} ${size}`;
    let displayH = size;

    if (typeof d3 !== 'undefined' && d3.hierarchy && d3.pack) {
      const data = { children: valid.map(([subject, seconds]) => ({ subject, seconds })) };
      const root = d3.hierarchy(data).sum(d => d.seconds);
      d3.pack().size([size, size]).padding(3)(root);
      const nodes = root.children || [];

      // 실제 원들의 bounding box 계산 → 빈 영역 잘라내기
      if (nodes.length > 0) {
        let minX = size, minY = size, maxX = 0, maxY = 0;
        for (const n of nodes) {
          if (n.x - n.r < minX) minX = n.x - n.r;
          if (n.y - n.r < minY) minY = n.y - n.r;
          if (n.x + n.r > maxX) maxX = n.x + n.r;
          if (n.y + n.r > maxY) maxY = n.y + n.r;
        }
        const pad = 12;
        const vbX = Math.max(0, minX - pad);
        const vbY = Math.max(0, minY - pad);
        const vbW = Math.min(size, maxX + pad - vbX);
        const vbH = Math.min(size, maxY + pad - vbY);
        viewBox = `${vbX.toFixed(2)} ${vbY.toFixed(2)} ${vbW.toFixed(2)} ${vbH.toFixed(2)}`;
        displayH = Math.round(size * vbH / vbW);
      }

      for (const n of nodes) {
        const color = getSubjectColor(n.data.subject);
        svgContent += `<circle cx="${n.x.toFixed(2)}" cy="${n.y.toFixed(2)}" r="${n.r.toFixed(2)}" fill="${color}"/>`;
        const subj = n.data.subject;
        const timeText = fmtEffortDurationShort(n.data.seconds);
        if (n.r >= 32) {
          svgContent += `<text x="${n.x.toFixed(2)}" y="${(n.y - 8).toFixed(2)}" text-anchor="middle" dominant-baseline="middle" class="bubble-l">${escapeHtml(subj)}</text>`;
          svgContent += `<text x="${n.x.toFixed(2)}" y="${(n.y + 12).toFixed(2)}" text-anchor="middle" class="bubble-s">${escapeHtml(timeText)}</text>`;
        } else if (n.r >= 20) {
          svgContent += `<text x="${n.x.toFixed(2)}" y="${n.y.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" class="bubble-m">${escapeHtml(subj)}</text>`;
        } else if (n.r >= 14) {
          const short = subj.length > 4 ? subj.slice(0, 3) + '…' : subj;
          svgContent += `<text x="${n.x.toFixed(2)}" y="${n.y.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" class="bubble-xs">${escapeHtml(short)}</text>`;
        }
      }
    } else {
      // d3 미로드 폴백
      const cols = Math.ceil(Math.sqrt(valid.length));
      const cellSize = size / cols;
      valid.forEach(([subject, seconds], i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cx2 = col * cellSize + cellSize / 2;
        const cy2 = row * cellSize + cellSize / 2;
        const maxR = cellSize / 2 - 4;
        const r2 = maxR * Math.sqrt(seconds / valid[0][1]);
        svgContent += `<circle cx="${cx2}" cy="${cy2}" r="${r2}" fill="${getSubjectColor(subject)}"/>`;
      });
    }
    const svg = `<svg class="effort-pie-svg" viewBox="${viewBox}" width="${size}" height="${displayH}">${svgContent}</svg>`;

    let legend = `<div class="effort-pie-legend">`;
    valid.forEach(([subj, sec]) => {
      const pct = Math.round(sec / totalSec * 100);
      const color = getSubjectColor(subj);
      legend += `
        <div class="effort-legend-row">
          <span class="effort-legend-color" style="background:${color};"></span>
          <span class="effort-legend-name">${escapeHtml(subj)}</span>
          <span class="effort-legend-val">${fmtEffortDurationShort(sec)}(${pct}%)</span>
        </div>
      `;
    });
    legend += `</div>`;

    return `<div class="effort-pie-wrap">${svg}${legend}</div>`;
  }

  function renderEffortLogItem(l) {
    const t = new Date(l.startedAt || 0);
    const timeStr = `${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;
    const duration = fmtEffortDuration(l.seconds || 0);
    const hasReflection = !!(l.reflection && l.reflection.trim());
    return `
      <div class="effort-log-item">
        <div class="effort-log-head">
          <span class="effort-log-subj">${escapeHtml(l.subject || '')}</span>
          ${l.method ? `<span class="effort-log-method">${escapeHtml(l.method)}</span>` : ''}
          <span class="effort-log-time">${timeStr} · ${duration}</span>
        </div>
        ${l.content ? `<div class="effort-log-content">${escapeHtml(l.content)}</div>` : ''}
        ${hasReflection ? `<div class="effort-log-reflection"><span class="effort-log-reflection-label">📔 느낀점</span>${escapeHtml(l.reflection)}</div>` : ''}
      </div>
    `;
  }

  function fmtEffortDuration(sec) {
    if (!sec || sec <= 0) return '0분';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h > 0) return m > 0 ? `${h}시간 ${m}분` : `${h}시간`;
    return `${m}분`;
  }

  function fmtEffortDurationShort(sec) {
    if (!sec || sec <= 0) return '0분';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h > 0) return m > 0 ? `${h}시간 ${m}분` : `${h}시간`;
    return `${m}분`;
  }

  function renderAssignmentsSection(assignments) {
    const todayStr = (() => {
      const d = new Date();
      const y = d.getFullYear();
      const m = (d.getMonth() + 1).toString().padStart(2, '0');
      const dd = d.getDate().toString().padStart(2, '0');
      return `${y}-${m}-${dd}`;
    })();

    // 분류: 진행 중(마감 미래 or 미완료), 완료
    const ongoing = [];
    const overdue = [];
    const done = [];
    for (const a of assignments) {
      if (a.isConfirmed) {
        done.push(a);
      } else if (!a.dueDate || a.dueDate >= todayStr) {
        ongoing.push(a);
      } else {
        overdue.push(a);
      }
    }

    // 진행 중을 마감일 오름차순 (마감일 가까운 것 위로)
    ongoing.sort((a, b) => (a.dueDate || '9999-12-31').localeCompare(b.dueDate || '9999-12-31'));
    overdue.sort((a, b) => (b.dueDate || '').localeCompare(a.dueDate || ''));
    done.sort((a, b) => (b.dueDate || '').localeCompare(a.dueDate || ''));

    const totalActive = ongoing.length + overdue.length;
    const countLabel = totalActive > 0
      ? `미완료 ${totalActive}개${done.length > 0 ? ` · 완료 ${done.length}개` : ''}`
      : `완료 ${done.length}개`;

    let bodyHtml = '';
    if (ongoing.length > 0) {
      bodyHtml += `<div class="asgn-group-label">진행 중</div>`;
      bodyHtml += ongoing.map(a => renderAssignmentItem(a, 'ongoing', todayStr)).join('');
    }
    if (overdue.length > 0) {
      bodyHtml += `<div class="asgn-group-label asgn-group-overdue">미제출 (마감 지남)</div>`;
      bodyHtml += overdue.map(a => renderAssignmentItem(a, 'overdue', todayStr)).join('');
    }
    if (done.length > 0) {
      const DONE_INITIAL = 5;
      const doneRecent = done.slice(0, DONE_INITIAL);
      const doneRest = done.slice(DONE_INITIAL);
      bodyHtml += `<div class="asgn-group-label">완료</div>`;
      bodyHtml += `<div id="asgnDoneRecent">${doneRecent.map(a => renderAssignmentItem(a, 'done', todayStr)).join('')}</div>`;
      if (doneRest.length > 0) {
        bodyHtml += `<div id="asgnDoneRest" style="display:none;">${doneRest.map(a => renderAssignmentItem(a, 'done', todayStr)).join('')}</div>`;
        bodyHtml += `<button class="test-more-btn" id="asgnMoreBtn" onclick="toggleAsgnMore()">+ 완료된 과제 ${doneRest.length}개 더 보기</button>`;
      }
    }

    return `
      <div class="month-card${totalActive > 0 ? ' open' : ''}">
        <div class="month-header" onclick="this.parentElement.classList.toggle('open')">
          <div><span class="month-title">받은 과제</span><span class="month-count">${countLabel}</span></div>
          <span class="month-arrow">▶</span>
        </div>
        <div class="month-body">${bodyHtml}</div>
      </div>
    `;
  }

  function renderAssignmentItem(a, status, todayStr) {
    const dueDate = a.dueDate;
    let dueLabel = '';
    if (dueDate) {
      const d = new Date(dueDate + 'T00:00:00');
      const mmdd = isNaN(d) ? dueDate : `${d.getMonth()+1}/${d.getDate()}`;
      if (status === 'overdue') {
        dueLabel = `<span class="asgn-due asgn-due-overdue">⚠ ${mmdd} 마감</span>`;
      } else if (status === 'done') {
        dueLabel = `<span class="asgn-due asgn-due-done">${mmdd} 마감</span>`;
      } else if (dueDate === todayStr) {
        dueLabel = `<span class="asgn-due asgn-due-today">⏰ 오늘 마감</span>`;
      } else {
        // 며칠 남았는지
        const today = new Date(todayStr + 'T00:00:00');
        const due = new Date(dueDate + 'T00:00:00');
        const daysLeft = Math.round((due - today) / 86400000);
        const daysLabel = daysLeft <= 7 ? ` · D-${daysLeft}` : '';
        dueLabel = `<span class="asgn-due">${mmdd} 마감${daysLabel}</span>`;
      }
    }
    const iconClass = status === 'done' ? 'asgn-icon-done'
                    : status === 'overdue' ? 'asgn-icon-overdue'
                    : 'asgn-icon-ongoing';
    const icon = status === 'done' ? '✓' : (status === 'overdue' ? '!' : '·');
    const lessonBadge = a.fromLesson ? `<span class="asgn-lesson-badge">수업 일지</span>` : '';
    const contentHtml = (a.content && a.content.trim())
      ? `<div class="asgn-content">${escapeHtml(a.content)}</div>`
      : '';
    return `
      <div class="asgn-item asgn-${status}">
        <div class="asgn-icon ${iconClass}">${icon}</div>
        <div class="asgn-body">
          <div class="asgn-title-row">
            <div class="asgn-title">${escapeHtml(a.title || '제목 없음')}</div>
            ${lessonBadge}
          </div>
          ${dueLabel}
          ${contentHtml}
        </div>
      </div>
    `;
  }

  window.toggleAsgnMore = function() {
    const rest = document.getElementById('asgnDoneRest');
    const btn = document.getElementById('asgnMoreBtn');
    if (!rest) return;
    if (rest.style.display === 'none') {
      rest.style.display = 'block';
      if (btn) btn.style.display = 'none';
    }
  };

  function renderTestItem(t) {
    const d = new Date((t.date || '') + 'T00:00:00');
    const dateStr = isNaN(d) ? (t.date || '') : `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
    const hasPdf = !!t.pdfUrl;
    const hasComment = !!(t.comment && t.comment.trim());
    const commentHtml = hasComment
      ? `<div class="test-item-comment">💬 ${escapeHtml(t.comment)}</div>`
      : '';
    if (hasPdf) {
      return `
        <a class="test-item" href="${escapeHtml(t.pdfUrl)}" target="_blank" rel="noopener">
          <div class="test-item-info">
            <div class="test-item-title-row">
              <div class="test-item-title">${escapeHtml(t.title)}</div>
              <span class="test-item-open">결과 보기</span>
            </div>
            <div class="test-item-date">${dateStr}</div>
            ${commentHtml}
          </div>
        </a>
      `;
    }
    // 코멘트만 있는 경우 (PDF 없음) — 링크가 아닌 일반 카드
    return `
      <div class="test-item test-item-noimg">
        <div class="test-item-info">
          <div class="test-item-title-row">
            <div class="test-item-title">${escapeHtml(t.title)}</div>
          </div>
          <div class="test-item-date">${dateStr}</div>
          ${commentHtml}
        </div>
      </div>
    `;
  }

  function renderLesson(l) {
    const dateObj = new Date((l.date || '') + 'T00:00:00');
    const mmdd = isNaN(dateObj) ? (l.date || '') : `${dateObj.getMonth()+1}/${dateObj.getDate()}`;
    const wd = l.weekday ? ` (${l.weekday})` : '';
    const hasLesson = l.hasLesson !== false && (l.content || l.task || l.myNote);

    let html = `
      <div class="lesson-item${!hasLesson ? ' lesson-item-asgn-only' : ''}">
        <div class="lesson-date">${mmdd}${wd}${l.className ? `<span class="lesson-class">${escapeHtml(l.className)}</span>` : ''}</div>
    `;
    // 수업 내용 (있을 때만)
    if (l.content) {
      html += `<div class="lesson-content">${escapeHtml(l.content)}</div>`;
    }
    // 수업 일지 연계 과제 (기존)
    if (l.task) {
      const due = l.taskDue ? ` <span style="color:var(--text3);">(마감 ${escapeHtml(l.taskDue)})</span>` : '';
      html += `<div class="lesson-task"><span class="lesson-task-label">과제</span> ${escapeHtml(l.task)}${due}</div>`;
    }
    // 과제 관리에서 부여된 추가 과제들
    if (Array.isArray(l.extraAssignments) && l.extraAssignments.length > 0) {
      for (const a of l.extraAssignments) {
        const due = a.dueDate ? ` <span style="color:var(--text3);">(마감 ${escapeHtml(a.dueDate)})</span>` : '';
        const doneMark = a.isConfirmed ? `<span style="color:#84b96d; font-weight:700; margin-right:4px;" title="완료">✓</span>` : '';
        html += `<div class="lesson-task lesson-task-extra">${doneMark}<span class="lesson-task-label">과제</span> ${escapeHtml(a.title || '제목 없음')}${due}</div>`;
      }
    }
    if (l.myNote) {
      html += `<div class="lesson-note"><span class="lesson-note-label">특이사항</span>${escapeHtml(l.myNote)}</div>`;
    }
    html += '</div>';
    return html;
  }

  // 월별 수업 캘린더 — 수업 있는 날 표시 + 클릭 시 해당 일지 펼침
  function renderMonthCalendar(m, monthIdx) {
    if (!m || !Array.isArray(m.lessons) || m.lessons.length === 0) {
      // 일지 없어도 학원 일정만 있을 수 있음 — 진행
    }
    // m.label "2026년 6월" 형식에서 년/월 파싱
    const match = (m.label || '').match(/(\d+)[년\.]+\s*(\d+)/);
    if (!match) {
      return (m.lessons || []).map(renderLesson).join('');
    }
    const year = parseInt(match[1], 10);
    const month = parseInt(match[2], 10);
    const firstDay = new Date(year, month - 1, 1);
    const lastDay = new Date(year, month, 0);
    const daysInMonth = lastDay.getDate();
    const firstWeekday = firstDay.getDay();

    // 수업 있는 날 매핑
    const lessonByDate = {};
    for (const l of (m.lessons || [])) {
      if (l.date) lessonByDate[l.date] = l;
    }

    // 학원 일정 매핑 (시작~종료 범위)
    const eventByDate = {};
    const academyEvents = (parentData && Array.isArray(parentData.academyEvents)) ? parentData.academyEvents : [];
    for (const ev of academyEvents) {
      const start = new Date((ev.date || '') + 'T00:00:00');
      const end = new Date((ev.endDate || ev.date || '') + 'T00:00:00');
      if (isNaN(start) || isNaN(end)) continue;
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        if (d.getFullYear() === year && d.getMonth() === month - 1) {
          const k = `${d.getFullYear()}-${pad2p(d.getMonth()+1)}-${pad2p(d.getDate())}`;
          if (!eventByDate[k]) eventByDate[k] = [];
          eventByDate[k].push(ev);
        }
      }
    }

    function pad2p(n) { return String(n).padStart(2, '0'); }
    const monthPad = pad2p(month);

    let html = `<div class="lesson-cal" id="lesson-cal-${monthIdx}">`;
    html += `<div class="lesson-cal-row lesson-cal-head">`;
    ['일','월','화','수','목','금','토'].forEach(w => {
      html += `<div class="lesson-cal-wd">${w}</div>`;
    });
    html += `</div>`;

    let row = `<div class="lesson-cal-row">`;
    for (let i = 0; i < firstWeekday; i++) row += `<div class="lesson-cal-day empty"></div>`;
    let weekday = firstWeekday;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${monthPad}-${pad2p(d)}`;
      const lesson = lessonByDate[dateStr];
      const evs = eventByDate[dateStr] || [];
      const hasClosed = evs.some(e => e.type === 'closed');
      const hasEvent = evs.some(e => e.type === 'event');

      let cls = 'lesson-cal-day';
      const classes = ['lesson-cal-day'];
      let onclick = '';
      if (lesson) {
        classes.push('has-lesson');
        onclick = `onclick="showMonthLesson(${monthIdx}, '${dateStr}')"`;
      }
      if (hasClosed) classes.push('has-closed');
      if (hasEvent) classes.push('has-event');

      let cellInner = `${d}`;
      let dotsHtml = '';
      if (hasClosed) dotsHtml += `<span class="cal-dot dot-closed"></span>`;
      if (hasEvent) dotsHtml += `<span class="cal-dot dot-event"></span>`;
      if (dotsHtml) cellInner += `<div class="cal-dots">${dotsHtml}</div>`;

      // 일지가 없고 학원 일정만 있어도 클릭 가능
      if (!lesson && (hasClosed || hasEvent)) {
        onclick = `onclick="showMonthLesson(${monthIdx}, '${dateStr}')"`;
      }

      row += `<div class="${classes.join(' ')}" data-date="${dateStr}" ${onclick}>${cellInner}</div>`;
      weekday++;
      if (weekday === 7 && d < daysInMonth) {
        row += `</div>`;
        html += row;
        row = `<div class="lesson-cal-row">`;
        weekday = 0;
      }
    }
    while (weekday < 7) {
      row += `<div class="lesson-cal-day empty"></div>`;
      weekday++;
    }
    row += `</div>`;
    html += row;
    html += `</div>`;
    html += `<div class="lesson-cal-hint">날짜를 클릭하면 그날의 수업 일지가 표시됩니다.</div>`;
    html += `<div class="lesson-detail" id="lesson-detail-${monthIdx}"></div>`;
    return html;
  }

  // 학원 일정 카드 렌더
  function renderAcademyEventCard(ev) {
    const isClosed = ev.type === 'closed';
    const typeLabel = isClosed ? '🛌 휴원' : '🎉 행사';
    const typeBg = isClosed ? '#fee2e2' : '#ede9fe';
    const typeColor = isClosed ? '#991b1b' : '#5b3fa8';
    const dateRange = ev.endDate && ev.endDate !== ev.date
      ? `${ev.date} ~ ${ev.endDate}` : (ev.date || '');
    let html = `<div class="academy-event-card ${isClosed ? 'closed' : 'event'}">`;
    html += `<div style="display:flex; gap:8px; align-items:flex-start; margin-bottom:6px;">`;
    html += `<span style="background:${typeBg}; color:${typeColor}; padding:3px 8px; border-radius:4px; font-size:11px; font-weight:700; flex-shrink:0;">${typeLabel}</span>`;
    html += `<div style="flex:1;"><div style="font-weight:700;">${escapeHtml(ev.title || '')}</div>`;
    html += `<div style="font-size:11.5px; color:var(--text3); margin-top:2px;">${dateRange}</div></div></div>`;
    if (ev.content) html += `<div style="font-size:12.5px; color:var(--text); margin-top:6px; white-space:pre-wrap;">${escapeHtml(ev.content)}</div>`;
    if (Array.isArray(ev.images) && ev.images.length > 0) {
      html += `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">`;
      ev.images.forEach(url => {
        html += `<img src="${url}" style="width:90px; height:90px; object-fit:cover; border-radius:6px; cursor:pointer;" onclick="window.open('${url}', '_blank')">`;
      });
      html += `</div>`;
    }
    html += `</div>`;
    return html;
  }

  // 캘린더 날짜 클릭 → 해당 일지 + 학원 일정을 캘린더 아래에 표시
  window.showMonthLesson = function(monthIdx, dateStr) {
    const m = (parentData && Array.isArray(parentData.months)) ? parentData.months[monthIdx] : null;
    if (!m) return;
    const lesson = (m.lessons || []).find(l => l.date === dateStr);
    const container = document.getElementById('lesson-detail-' + monthIdx);
    if (!container) return;

    // 그날에 해당하는 학원 일정 (시작~종료 범위 포함)
    const academyEvents = (parentData && Array.isArray(parentData.academyEvents)) ? parentData.academyEvents : [];
    const dayEvents = academyEvents.filter(ev => {
      const s = ev.date || '';
      const e = ev.endDate || ev.date || '';
      return s <= dateStr && dateStr <= e;
    });

    let html = '';
    for (const ev of dayEvents) html += renderAcademyEventCard(ev);
    if (lesson) html += renderLesson(lesson);
    if (!html) html = `<div style="text-align:center; padding:14px; color:var(--text3); font-size:13px;">선택한 날짜에 내용이 없습니다.</div>`;
    container.innerHTML = html;

    // 선택된 날짜 하이라이트
    const cal = document.getElementById('lesson-cal-' + monthIdx);
    if (cal) {
      cal.querySelectorAll('.lesson-cal-day.selected').forEach(d => d.classList.remove('selected'));
      const sel = cal.querySelector(`[data-date="${dateStr}"]`);
      if (sel) sel.classList.add('selected');
    }
  };
</script>
</body>
</html>
