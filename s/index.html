  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #fefcf8;
      --surface: #ffffff;
      --surface2: #f9f6ef;
      --border: #e6dfd0;
      --text: #2a2a2a;
      --text2: #5a5a5a;
      --text3: #999;
      --accent: #8b5a2b;
      --accent-light: #c69856;
      --accent-dark: #6b4520;
      --danger: #c0392b;
      --warning: #e8a23e;
      --success: #5d8a4a;
      --info: #3498db;
      --radius: 12px;
    }
    html, body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 600px; margin: 0 auto; padding: 0; padding-bottom: 60px; }

    .header {
      padding: 24px 20px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-brand { font-family: 'Gowun Batang', serif; font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; text-align: center; }
    .header-tagline { font-family: 'Gowun Batang', serif; font-size: 11px; color: var(--text3); text-align: center; margin-top: 2px; }
    .student-info { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; padding-top: 14px; border-top: 0.5px solid var(--border); }
    .student-name { font-size: 18px; font-weight: 600; }
    .student-meta { font-size: 12px; color: var(--text3); }

    .progress-card { margin: 16px 20px; padding: 18px 20px; background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); }
    .progress-title { font-size: 13px; color: var(--text2); margin-bottom: 10px; }
    .progress-bar-bg { width: 100%; height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-light), var(--accent)); transition: width 0.5s; border-radius: 5px; }
    .progress-text { display: flex; justify-content: space-between; font-size: 12px; }
    .progress-percent { font-weight: 600; color: var(--accent); }
    .progress-detail { color: var(--text3); }

    .section { margin: 20px 20px 0; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .section-count { background: var(--surface2); color: var(--text3); padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
    /* 그룹 라벨 (오답노트 vs 과제) — 섹션 헤더 (버튼 아님) */
    .group-label {
      margin: 28px 20px 8px;
      padding: 0 0 8px 0;
      font-size: 18px; font-weight: 800;
      background: none; border-radius: 0;
      border-bottom: 2px solid;
    }
    .group-label.note-group {
      color: #5a3a9e;
      border-bottom-color: #7c5cbf;
    }
    .group-label.task-group {
      color: #1e4a8a;
      border-bottom-color: #2563eb;
      margin-top: 36px;
    }
    .completed-arrow { font-size: 10px; color: var(--text3); margin-left: 2px; }
    .completed-toggle { user-select: none; }
    .completed-more-btn { width: 100%; margin-top: 6px; padding: 9px; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 10px; font-size: 13px; color: var(--text2); cursor: pointer; font-family: inherit; }
    .section-count.today { background: #fcebd5; color: var(--accent); }
    .section-count.overdue { background: #fdd9d3; color: var(--danger); }

    .note-card { background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); padding: 14px 16px; margin-bottom: 10px; }
    .note-card.today { border-left: 3px solid var(--accent); }
    .note-card.overdue { border-left: 3px solid var(--danger); background: #fdf7f5; }
    .note-card.completed { opacity: 0.7; background: var(--surface2); }
    .note-card.submitted { border-left: 3px solid var(--info); background: #f0f7fc; }
    .note-card.confirmed { border-left: 3px solid var(--success); background: #f3f8f0; }
    .note-card.task { border-left: 3px solid #7c5cbf; }
    .note-card-title { font-size: 14px; font-weight: 500; line-height: 1.4; margin-bottom: 4px; word-break: keep-all; }
    .note-card-meta { font-size: 11px; color: var(--text3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .note-card-round { background: var(--accent); color: white; padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: 600; }
    .note-card-round.overdue { background: var(--danger); }
    .note-card-round.upcoming { background: var(--surface2); color: var(--text2); }
    .note-card-round.completed { background: var(--text3); }
    .note-card-round.task { background: #7c5cbf; }
    .note-card-date { font-size: 11px; color: var(--text3); }
    .note-card-status { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 8px; }
    .note-card-status.submitted { background: var(--info); color: white; }
    .note-card-status.confirmed { background: var(--success); color: white; }

    .teacher-comment {
      margin-top: 10px;
      padding: 10px 12px;
      background: #fef9e7;
      border-left: 3px solid #e8a23e;
      border-radius: 6px;
    }
    .teacher-comment-label {
      font-size: 11px;
      font-weight: 600;
      color: #a86b1c;
      margin-bottom: 4px;
    }
    .teacher-comment-body {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    .upload-area { margin-top: 12px; padding-top: 12px; border-top: 0.5px dashed var(--border); }
    .upload-btn { width: 66.67%; max-width: 380px; margin: 8px auto; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 14px; background: #e8dcc4; color: #5a4a2f; border: 0.5px solid rgba(120,90,60,0.25); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .upload-btn:active { background: #d9c9aa; }
    .upload-btn:active { background: var(--accent-dark); }
    .upload-btn:disabled { background: var(--text3); cursor: not-allowed; }
    .upload-btn.secondary { background: var(--surface); color: var(--accent); border: 1px solid var(--accent-light); }
    .upload-btn.secondary:active { background: var(--surface2); }

    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .photo-item { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--surface2); }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-item.uploading { opacity: 0.5; }
    .photo-item .photo-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .photo-item .photo-delete { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; background: rgba(0, 0, 0, 0.6); color: white; border: none; border-radius: 50%; font-size: 14px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .photo-item .photo-delete:active { background: rgba(0, 0, 0, 0.8); }

    .submit-status { font-size: 12px; color: var(--text2); margin-top: 8px; padding: 8px 10px; background: var(--surface2); border-radius: 6px; line-height: 1.5; }
    .submit-status.success { background: #e8f3e0; color: var(--success); }
    .submit-status.info { background: #e3eff8; color: var(--info); }

    .empty-state { text-align: center; padding: 30px 20px; color: var(--text3); font-size: 13px; }

    .loading { text-align: center; padding: 60px 20px; color: var(--text3); }
    .loading-spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state { text-align: center; padding: 60px 20px; }
    .error-icon { font-size: 48px; margin-bottom: 12px; }
    .error-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--danger); }
    .error-text { font-size: 13px; color: var(--text2); line-height: 1.6; }

    .footer { text-align: center; padding: 30px 20px 40px; font-size: 11px; color: var(--text3); }
    .refresh-btn { display: inline-flex; align-items: center; gap: 4px; padding: 8px 16px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 18px; font-size: 12px; color: var(--text2); cursor: pointer; margin-bottom: 10px; font-family: inherit; }
    .make-note-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 66.67%; max-width: 380px; margin: 0 auto 16px; box-sizing: border-box; padding: 13px; background: #c8e6c9; color: #1b5e20; border: 0.5px solid rgba(46,125,50,0.3); border-radius: 12px; font-size: 15px; font-weight: 700; text-decoration: none; box-shadow: 0 2px 6px rgba(46,125,50,0.15); }
    .make-note-btn:active { background: #a5d6a7; }
    /* 모든 가로 버튼 동일 크기 */
    .upload-btn,
    .grades-action-btn {
      width: 66.67% !important;
      max-width: 380px !important;
      box-sizing: border-box;
    }
    .refresh-btn:active { background: var(--surface2); }
    .last-updated { display: block; margin-top: 6px; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 10px 18px; border-radius: 24px; font-size: 13px; z-index: 100; animation: toast-in 0.3s; max-width: 90vw; text-align: center; }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

    .photo-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .photo-viewer.active { display: flex; }
    .photo-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .photo-viewer-close { position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; font-size: 22px; cursor: pointer; z-index: 201; }
  .gi-label {
    display: block; font-size: 11px; color: var(--text2); font-weight: 600; margin-bottom: 3px;
  }
  .gi-input {
    width: 100%; box-sizing: border-box;
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  .gi-input:focus { outline: none; border-color: var(--accent); }

  /* 메인 메뉴 */
  .menu-grid { display: flex; flex-direction: column; gap: 14px; margin: 32px auto 16px; width: 80%; max-width: 380px; }
  .menu-card {
    display: block; padding: 18px 20px; background: var(--surface);
    border-radius: 10px; border: 1px solid var(--border);
    text-decoration: none; color: var(--text);
    transition: background 0.12s ease, transform 0.08s ease;
    text-align: center;
  }
  .menu-card:active { transform: scale(0.985); background: var(--surface2); }
  .menu-label { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
  .menu-sub { font-size: 11.5px; color: var(--text3); margin-top: 4px; }
  .menu-learning { border-left: 3px solid var(--accent-light); }
  .menu-video { border-left: 3px solid #97aac8; }
  .menu-grades { border-left: 3px solid #b095d5; }

  /* 미니 진행률 (학습관리 화면) */
  .progress-mini-wrap { display: flex; flex-direction: column; gap: 10px; margin: 10px 0 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .pm-section-title { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; margin-bottom: 2px; }
  .progress-mini-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .pm-label { font-size: 12px; font-weight: 600; color: var(--text); }
  .pm-stat { font-size: 11px; color: var(--text2); }
  .progress-mini-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .progress-mini-fill { height: 100%; background: var(--accent-light); border-radius: 3px; transition: width 0.3s ease; }
  .progress-mini-fill.task { background: #97aac8; }

  .back-link {
    display: inline-block; padding: 7px 14px; margin: 6px 4px 4px 0;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    text-decoration: none; font-size: 13px; font-weight: 600;
    transition: background 0.12s ease;
  }
  .back-link:active { background: var(--surface2); }
  .back-link:active { opacity: 0.6; }
  .view-title { font-size: 19px; font-weight: 700; margin: 6px 0 14px; color: var(--text); letter-spacing: -0.3px; }
  .empty-view-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 32px 20px; text-align: center;
    margin: 16px 0;
  }
  /* 성적 관리 액션 버튼 */
  .grades-action-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 66.67%; max-width: 380px; margin: 18px auto;
    padding: 13px; background: #e8dcc4; color: #5a4a2f;
    border: 0.5px solid rgba(120,90,60,0.25); border-radius: 10px;
    font-size: 14px; font-weight: 600; text-decoration: none; letter-spacing: -0.2px;
    transition: background 0.12s ease;
  }
  .grades-action-btn:active { background: #d9c9aa; }
  /* 성적 추이 그래프 */
  .grade-chart-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; margin-bottom: 10px;
  }
  .grade-chart-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .chart-empty { padding: 16px; text-align: center; color: var(--text3); font-size: 12px; }
  .chart-axis-label { font-size: 10px; color: var(--text3); text-align: right; margin-top: 4px; }
  /* 지난 시험 카드 */
  .history-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; margin-bottom: 10px;
  }
  .history-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .history-title { font-weight: 700; font-size: 13.5px; color: var(--text); flex: 1; min-width: 0; }
  .history-score { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .hs-score { font-size: 13px; font-weight: 700; color: var(--accent-dark); }
  .hs-grade { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; }
  .hs-rank { font-size: 11px; color: var(--text2); padding: 2px 6px; background: var(--surface2); border-radius: 4px; }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div style="margin-top:12px;">불러오는 중...</div>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" multiple style="display:none;">

<div class="photo-viewer" id="photoViewer" onclick="closePhotoViewer()">
  <button class="photo-viewer-close" onclick="closePhotoViewer()">×</button>
  <img id="photoViewerImg" src="" alt="">
</div>

<script>
  const CLOUDINARY_CLOUD_NAME = 'dyjtnb4he';
  const CLOUDINARY_UPLOAD_PRESET = 'student_submissions';
  const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

  let studentCode = '';
  let studentData = null;
  let submissions = {};

  (async function() {
    const params = new URLSearchParams(window.location.search);
    studentCode = (params.get('code') || '').trim();
    if (!studentCode) { renderError('학생 코드가 없습니다', '올바른 학생 URL로 접속해주세요.'); return; }
    if (!/^[a-z0-9]{6,20}$/.test(studentCode)) { renderError('잘못된 학생 코드', '올바른 학생 URL로 접속해주세요.'); return; }

    loadSubmissions();

    try {
      const url = `../students/${studentCode}.json?t=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) {
        if (res.status === 404) renderError('학생 페이지를 찾을 수 없습니다', '학생 URL이 정확한지 확인해주세요.<br>문제가 계속되면 선생님께 문의하세요.');
        else renderError('데이터 로드 실패', `오류 코드: ${res.status}`);
        return;
      }
      studentData = await res.json();
      // 디버그: 과제 데이터 확인 (문제 생기면 콘솔에서 볼 수 있음)
      console.log('[학생페이지] tasks:', studentData.tasks, '| 오늘요일:', new Date().getDay());
      renderPage();
    } catch (e) {
      console.error(e);
      renderError('네트워크 오류', '인터넷 연결을 확인해주세요.<br>' + e.message);
    }
  })();

  function loadSubmissions() {
    try {
      const raw = localStorage.getItem(`submissions_${studentCode}`);
      submissions = raw ? JSON.parse(raw) : {};
    } catch (e) { submissions = {}; }
  }
  function saveSubmissions() {
    try { localStorage.setItem(`submissions_${studentCode}`, JSON.stringify(submissions)); } catch (e) {}
  }
  function getSubmission(assignmentId, round) {
    return submissions[`${assignmentId}_${round}`] || { photos: [], submittedAt: null, confirmedAt: null };
  }
  function setSubmission(assignmentId, round, data) {
    submissions[`${assignmentId}_${round}`] = data;
    saveSubmissions();
  }

  function renderPage() {
    const data = studentData;
    const app = document.getElementById('app');
    const s = data.student || {};

    const view = ((location.hash || '').replace('#', '') || 'menu');

    const headerHtml = `
      <div class="header">
        <div class="header-brand">생각의 흐름 · 기억의 설계</div>
        <div class="header-tagline">잊지 않게 만드는 수학 학습</div>
        <div class="student-info">
          <div class="student-name">${escapeHtml(s.name || '학생')}</div>
          <div class="student-meta">${escapeHtml([s.school, s.grade].filter(Boolean).join(' · '))}</div>
        </div>
      </div>
    `;

    let body = '';
    if (view === 'learning') {
      body = renderLearningView(data);
    } else if (view === 'video') {
      body = renderVideoView(data);
    } else if (view === 'grades') {
      body = renderGradesView(data);
    } else if (view === 'grades-input') {
      body = renderGradesInputView(data);
    } else {
      body = renderMainMenu(data);
    }

    const updatedTime = data.generatedAt ? new Date(data.generatedAt) : null;
    const footerHtml = `
      <div class="footer">
        <button class="refresh-btn" onclick="location.reload()">🔄 새로고침</button>
        ${updatedTime ? `<span class="last-updated">마지막 업데이트: ${formatRelativeTime(updatedTime)}</span>` : ''}
      </div>
    `;

    app.innerHTML = headerHtml + body + footerHtml;

    if (view === 'grades' || view === 'grades-input') {
      loadGradeExams().catch(e => console.warn('시험 정보 로드 실패:', e));
    }
  }

  function backLinkHtml() {
    return `<div style="text-align:right; margin-right:4px;"><a href="#menu" class="back-link">← 메인으로</a></div>`;
  }

  function renderMainMenu(data) {
    return `
      <div class="menu-grid">
        <a href="#learning" class="menu-card menu-learning">
          <div class="menu-label">학습관리</div>
          <div class="menu-sub">과제 / 오답노트</div>
        </a>
        <a href="#video" class="menu-card menu-video">
          <div class="menu-label">강의 영상</div>
        </a>
        <a href="#grades" class="menu-card menu-grades">
          <div class="menu-label">성적 관리</div>
        </a>
      </div>
    `;
  }

  function renderLearningView(data) {
    const s = data.student || {};
    const wp = data.weekProgress || { total: 0, done: 0, percent: 0 };

    // 과제 진행률 계산 (이번 주)
    const weekStart = wp.startDate, weekEnd = wp.endDate;
    const weekTasks = (data.tasks || []).filter(t => t.dueDate && weekStart && weekEnd && t.dueDate >= weekStart && t.dueDate <= weekEnd);
    const weekTaskDone = weekTasks.filter(t => {
      const info = getTeacherConfirm(t.assignmentId, t.round || 1);
      return !!(info && info.confirmed);
    }).length;
    const weekTaskTotal = weekTasks.length;
    const tpPercent = weekTaskTotal > 0 ? Math.round(weekTaskDone / weekTaskTotal * 100) : 0;

    let html = backLinkHtml();
    html += `<h2 class="view-title">학습관리</h2>`;
    html += `
      <div class="progress-mini-wrap">
        <div class="pm-section-title">이번 주 학습일정</div>
        <div class="progress-mini">
          <div class="progress-mini-head">
            <span class="pm-label">오답노트</span>
            <span class="pm-stat">${wp.done}/${wp.total} · ${wp.percent}%</span>
          </div>
          <div class="progress-mini-bar"><div class="progress-mini-fill" style="width:${wp.percent}%;"></div></div>
        </div>
        <div class="progress-mini">
          <div class="progress-mini-head">
            <span class="pm-label">과제</span>
            <span class="pm-stat">${weekTaskDone}/${weekTaskTotal} · ${tpPercent}%</span>
          </div>
          <div class="progress-mini-bar"><div class="progress-mini-fill task" style="width:${tpPercent}%;"></div></div>
        </div>
      </div>
    `;
    html += (s.showMakeNote ? `<a class="make-note-btn" href="https://pokerface815.github.io/wrong-notes/?name=${encodeURIComponent(s.name || '')}">
      ✏️ 오답노트 만들기
    </a>` : '');
    html += '<div class="group-label note-group">오답노트</div>';
    html += renderSection('오늘 풀어야 할 오답노트', data.today || [], 'today', '오늘 풀 오답노트가 없어요. 잠깐 쉬는 날 ☺️', true);
    if ((data.overdue || []).length > 0) html += renderSection('밀린 오답노트', data.overdue, 'overdue', '', true);
    if ((data.upcoming || []).length > 0) html += renderSection('이번 주 일정', data.upcoming, 'upcoming', '', false);
    if ((data.completed || []).length > 0) html += renderCompletedSection(data.completed);
    if ((data.tasks || []).length > 0) {
      html += '<div class="group-label task-group">과제</div>';
      html += renderTaskSection(data.tasks);
    }
    return html;
  }

  function renderVideoView(data) {
    let html = backLinkHtml();
    html += `<h2 class="view-title">강의 영상</h2>`;
    html += `
      <div class="empty-view-card">
        <div style="font-size:15px; font-weight:600; color:var(--text); margin-bottom:6px;">준비 중입니다</div>
        <div style="font-size:13px; color:var(--text2); line-height:1.6;">곧 강의 영상을 이곳에서 볼 수 있어요.</div>
      </div>
    `;
    return html;
  }

  function renderGradesView(data) {
    let html = backLinkHtml();
    html += `<h2 class="view-title">성적 관리</h2>`;
    html += `<div id="gradeChartSection"></div>`;
    html += `
      <a href="#grades-input" class="grades-action-btn">
        성적 입력 / 반성
      </a>
    `;
    return html;
  }

  function renderGradesInputView(data) {
    let html = `<div style="text-align:right; margin-right:4px;"><a href="#grades" class="back-link">← 성적 관리</a></div>`;
    html += `<h2 class="view-title">성적 입력 / 반성</h2>`;
    html += `<div id="gradeInputSection"></div>`;
    return html;
  }

  // ===== 성적 추이 그래프 =====
  function renderGradeChart(myGrades) {
    const wrap = document.getElementById('gradeChartSection');
    if (!wrap) return;
    // "최종" examKind 제외 (옛 데이터 호환)
    const allGrades = (myGrades || []).filter(g => g.type !== 'naesin' || g.examKind !== '최종');
    const naesin = allGrades.filter(g => g.type === 'naesin');
    const mock = allGrades.filter(g => g.type === 'mock');
    if (naesin.length === 0 && mock.length === 0) { wrap.innerHTML = ''; return; }

    let html = '';
    if (naesin.length >= 1) {
      html += `<div class="grade-chart-card">
        <div class="grade-chart-title">학교 내신</div>
        ${renderNaesinBarChart(naesin)}
      </div>`;
    }
    if (mock.length >= 1) {
      html += `<div class="grade-chart-card">
        <div class="grade-chart-title">모의고사</div>
        ${renderMockBarChart(mock)}
      </div>`;
    }
    wrap.innerHTML = html;
  }

  // 학교 내신 그래프 — 기본 5과목 × 2(중간/기말) = 10슬롯 + 학생 추가 과목
  function renderNaesinBarChart(items) {
    const DEFAULT_SUBJECTS = ['공통수학1', '공통수학2', '대수', '미적분1', '확률과 통계'];
    const inputSubjects = [...new Set(items.map(g => g.subject).filter(Boolean))];
    const extraSubjects = inputSubjects.filter(s => !DEFAULT_SUBJECTS.includes(s));
    const subjects = [...DEFAULT_SUBJECTS, ...extraSubjects];
    const slots = [];
    for (const subj of subjects) {
      for (const ek of ['중간', '기말']) {
        const match = items.find(g => g.subject === subj && g.examKind === ek);
        slots.push({
          topLabel: ek,
          groupLabel: subj,
          grade: match,
        });
      }
    }
    return renderSlotChart(slots, 5);
  }

  // 모의고사 그래프 — 최소 10슬롯, 시간순 채움
  function renderMockBarChart(items) {
    const sorted = items.slice().sort((a,b) => {
      if (a.year !== b.year) return (a.year||0) - (b.year||0);
      return (a.month||0) - (b.month||0);
    });
    const MIN_SLOTS = 10;
    const n = Math.max(MIN_SLOTS, sorted.length);
    const slots = [];
    for (let i = 0; i < n; i++) {
      const g = sorted[i];
      if (g) {
        const lvl = g.gradeLevel || '';
        const m = g.month != null ? `${g.month}월` : '';
        const elective = (g.elective || '').slice(0, 4);
        slots.push({ topLabel: lvl, groupLabel: m, grade: g, footLabel: elective });
      } else {
        slots.push({ topLabel: '', groupLabel: '', grade: null });
      }
    }
    return renderSlotChart(slots, 9);
  }

  // 공통 슬롯 막대 그래프
  function renderSlotChart(slots, maxGradeLevels) {
    if (slots.length === 0) return '';
    const n = slots.length;
    // 10슬롯이 모바일 한 화면에 맞도록 — n*28, 최소 320
    const W = Math.max(320, n * 28);
    const H = 200, padL = 22, padR = 10, padT = 24, padB = 64;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const yMax = 100;
    const barGap = 2;
    // 막대 폭 80% (남은 20%는 좌우 여백)
    const barWAvail = (innerW - barGap * (n - 1)) / Math.max(n, 1);
    const barW = Math.max(7, barWAvail * 0.8);
    const barOffset = (barWAvail - barW) / 2;

    const slotCx = slots.map((_, i) => padL + i * (barWAvail + barGap) + barWAvail / 2);

    let bars = '';
    let topLabels = '';
    slots.forEach((slot, i) => {
      const cx = slotCx[i];
      const x = cx - barW / 2;
      const g = slot.grade;
      const v = g ? (g.score ?? g.mathScore) : null;
      if (v != null) {
        const h = (Number(v) / yMax) * innerH;
        const y = padT + innerH - h;
        const color = gradeColor(g.grade);
        bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${color}" rx="3" ry="3" opacity="0.88"/>`;
        bars += `<text x="${cx}" y="${y - 5}" text-anchor="middle" font-size="10" fill="#333" font-weight="700">${v}</text>`;
      } else {
        bars += `<rect x="${x}" y="${padT + innerH - 5}" width="${barW}" height="5" fill="#eee" rx="2" ry="2"/>`;
      }
      if (slot.topLabel) topLabels += `<text x="${cx}" y="${H - 42}" text-anchor="middle" font-size="9.5" fill="#555" font-weight="600">${escapeHtml(slot.topLabel)}</text>`;
      if (slot.footLabel) topLabels += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="8.5" fill="#999">${escapeHtml(slot.footLabel)}</text>`;
    });

    let groupLabels = '';
    let i = 0;
    while (i < n) {
      const gl = slots[i].groupLabel;
      if (!gl) { i++; continue; }
      let j = i;
      while (j < n && slots[j].groupLabel === gl) j++;
      const startCx = slotCx[i] - barWAvail / 2;
      const endCx = slotCx[j - 1] + barWAvail / 2;
      const midX = (startCx + endCx) / 2;
      const shortLabel = gl.length > 7 ? gl.slice(0, 6) + '…' : gl;
      groupLabels += `<text x="${midX}" y="${H - 26}" text-anchor="middle" font-size="10" fill="#333" font-weight="700">${escapeHtml(shortLabel)}</text>`;
      if (j - i > 1) {
        groupLabels += `<line x1="${startCx + 2}" y1="${H - 18}" x2="${endCx - 2}" y2="${H - 18}" stroke="#bbb" stroke-width="1"/>`;
      }
      i = j;
    }

    return `
      <div style="overflow-x:auto;">
        <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="background:#fff; border-radius:6px; display:block; min-width:${W}px;">
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + innerH}" stroke="#e8e8e8" stroke-width="1"/>
          <line x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}" stroke="#e8e8e8" stroke-width="1"/>
          <text x="${padL - 4}" y="${padT + 4}" text-anchor="end" font-size="8.5" fill="#999">100</text>
          <text x="${padL - 4}" y="${padT + innerH + 3}" text-anchor="end" font-size="8.5" fill="#999">0</text>
          ${bars}
          ${topLabels}
          ${groupLabels}
        </svg>
      </div>
      ${renderGradeLegend(maxGradeLevels)}
    `;
  }

  // 등급별 색상 범례 (5 또는 9)
  function renderGradeLegend(maxLevels) {
    const max = maxLevels || 9;
    let dots = '';
    for (let g = 1; g <= max; g++) {
      dots += `<span style="display:inline-flex; align-items:center; gap:3px;">
        <span style="display:inline-block; width:9px; height:9px; background:${gradeColor(g)}; border-radius:2px;"></span>
        <span style="font-size:10px; color:var(--text2); font-weight:600;">${g}</span>
      </span>`;
    }
    return `<div style="display:flex; gap:8px; justify-content:center; align-items:center; margin-top:8px; flex-wrap:wrap;"><span style="font-size:10px; color:var(--text3); margin-right:2px;">등급</span>${dots}</div>`;
  }

  function gradeColor(g) {
    if (g == null) return '#999';
    const colors = {1:'#2ecc71', 2:'#27ae60', 3:'#3498db', 4:'#5d8a4a', 5:'#e8a23e', 6:'#e67e22', 7:'#d35400', 8:'#c0392b', 9:'#922b21'};
    return colors[g] || '#999';
  }

  // ===== 지난 시험 기록 + 반성 =====
  function renderGradeHistory(myGrades) {
    const wrap = document.getElementById('gradeHistorySection');
    if (!wrap) return;
    const items = (myGrades || []).slice().sort((a,b) => {
      const ay = (a.year || 0), by = (b.year || 0);
      if (ay !== by) return by - ay;
      if (a.type === 'mock' && b.type === 'mock') return (b.month||0) - (a.month||0);
      return String(b.semester || '').localeCompare(String(a.semester || ''));
    });
    if (items.length === 0) { wrap.innerHTML = ''; return; }

    // localStorage에서 임시 저장된 반성 가져오기
    loadReflectionDrafts();

    let html = `<div class="group-label" style="background:#fef8e8; border-left:4px solid #e8b423; color:#7a5520;">📔 지난 시험 + 반성</div>`;
    html += `<div style="font-size:12px; color:var(--text2); margin:0 0 10px 4px; line-height:1.5;">시험을 돌아보며 다음을 다지는 시간 ✍️</div>`;
    for (const g of items) {
      const isMock = g.type === 'mock';
      const title = isMock
        ? `${g.gradeLevel || ''} · ${g.year}-${String(g.month).padStart(2,'0')}월 모의고사${g.elective ? ` (${escapeHtml(g.elective)})` : ''}`
        : `${escapeHtml(g.subject || '')} · ${g.year}-${g.semester}학기 · ${g.examKind || ''}`;
      const score = isMock ? g.mathScore : g.score;
      const draftKey = `reflection__${g.id}`;
      const currentReflection = (cachedReflectionDrafts[draftKey] && cachedReflectionDrafts[draftKey].text != null)
        ? cachedReflectionDrafts[draftKey].text
        : (g.reflection || '');
      const isSent = cachedReflectionDrafts[draftKey] && cachedReflectionDrafts[draftKey].sentAt;
      const isDirty = cachedReflectionDrafts[draftKey] && cachedReflectionDrafts[draftKey].text != null && cachedReflectionDrafts[draftKey].text !== (g.reflection || '');

      html += `
        <div class="history-card">
          <div class="history-head">
            <div class="history-title">${title}</div>
            <div class="history-score">
              ${score != null ? `<span class="hs-score">${score}점</span>` : ''}
              ${g.grade ? `<span class="hs-grade" style="background:${gradeColor(g.grade)};">${g.grade}등급</span>` : ''}
              ${(g.rank && g.totalStudents) ? `<span class="hs-rank">${g.rank}/${g.totalStudents}</span>` : ''}
            </div>
          </div>
          <div style="margin-top:8px;">
            <label class="gi-label">✍️ 이번 시험 반성 · 다음 다짐</label>
            <textarea class="gi-input reflection-input" data-grade-id="${g.id}" rows="3" placeholder="예: 계산 실수 많았음. 다음엔 검산 두 번 하자!">${escapeHtml(currentReflection)}</textarea>
            ${isSent && !isDirty ? `<div style="font-size:11px; color:var(--success); margin-top:4px; font-weight:600;">✓ ${formatRelativeTime(new Date(cachedReflectionDrafts[draftKey].sentAt))} 전송됨</div>` : ''}
            ${isDirty ? `<div style="font-size:11px; color:#e8a23e; margin-top:4px;">📝 수정됨 — 아래 저장 버튼으로 전송</div>` : ''}
          </div>
        </div>
      `;
    }
    html += `
      <button class="make-note-btn" style="background:#7c5cbf; margin:4px 0 20px;" onclick="saveAllReflections()">
        💾 반성/다짐 저장 (선생님께 전송)
      </button>
    `;
    wrap.innerHTML = html;

    // 인풋 변경 이벤트
    wrap.querySelectorAll('.reflection-input').forEach(el => {
      el.addEventListener('input', () => {
        const gid = el.dataset.gradeId;
        const k = `reflection__${gid}`;
        if (!cachedReflectionDrafts[k]) cachedReflectionDrafts[k] = {};
        cachedReflectionDrafts[k].text = el.value;
        saveReflectionDrafts();
      });
    });
  }

  let cachedReflectionDrafts = {};
  function loadReflectionDrafts() {
    try {
      const raw = localStorage.getItem('myReflectionDrafts__' + studentCode);
      if (raw) cachedReflectionDrafts = JSON.parse(raw) || {};
    } catch (e) { cachedReflectionDrafts = {}; }
  }
  function saveReflectionDrafts() {
    try { localStorage.setItem('myReflectionDrafts__' + studentCode, JSON.stringify(cachedReflectionDrafts)); } catch (e) {}
  }

  async function saveAllReflections() {
    const items = [];
    for (const k in cachedReflectionDrafts) {
      const d = cachedReflectionDrafts[k];
      if (d.text == null) continue;
      const gradeId = k.replace('reflection__', '');
      items.push({ gradeId, text: d.text });
    }
    if (items.length === 0) {
      alert('전송할 반성/다짐이 없습니다.');
      return;
    }
    if (!confirm(`${items.length}개 시험의 반성/다짐을 선생님께 전송합니다.\n진행할까요?`)) return;

    const payload = {
      studentCode,
      studentName: (studentData.student || {}).name || '',
      submittedAt: new Date().toISOString(),
      reflections: items,
    };

    try {
      const jsonStr = JSON.stringify(payload, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const file = new File([blob], `reflection_${studentCode}_${Date.now()}.json`, { type: 'application/json' });
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('tags', `student_${studentCode},reflection_submission`);
      formData.append('context', `student_code=${studentCode}|kind=reflection_submission`);
      const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
      const res = await fetch(url, { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok || !data.secure_url) throw new Error((data.error && data.error.message) || '업로드 실패');
      const now = new Date().toISOString();
      for (const it of items) {
        const k = `reflection__${it.gradeId}`;
        cachedReflectionDrafts[k].sentAt = now;
      }
      saveReflectionDrafts();
      renderGradeHistory((studentData || {}).myGrades || []);
      alert(`✓ ${items.length}개 반성/다짐을 선생님께 전송했습니다.`);
    } catch (e) {
      console.error(e);
      alert('전송 실패: ' + e.message);
    }
  }

  // ===== 내 성적 입력 =====
  let cachedSchoolGradeCuts = null;
  let cachedLocalDrafts = {};  // { entryId__examKind: {score, grade, rank, percent, savedAt} }

  function loadLocalDrafts() {
    try {
      const raw = localStorage.getItem('mySchoolGradeDrafts__' + studentCode);
      if (raw) cachedLocalDrafts = JSON.parse(raw) || {};
    } catch (e) { cachedLocalDrafts = {}; }
  }
  function saveLocalDrafts() {
    try { localStorage.setItem('mySchoolGradeDrafts__' + studentCode, JSON.stringify(cachedLocalDrafts)); } catch (e) {}
  }

  async function loadGradeExams() {
    loadLocalDrafts();
    const myGrades = (studentData || {}).myGrades || [];
    // 성적 관리 메인 — 그래프만
    if (document.getElementById('gradeChartSection')) renderGradeChart(myGrades);
    // 성적 입력/반성 화면 — 입력폼 + 반성 카드
    if (document.getElementById('gradeHistorySection')) renderGradeHistory(myGrades);
    // 입력 폼은 school_grade_cuts 필요
    if (document.getElementById('gradeInputSection')) {
      try {
        if (!cachedSchoolGradeCuts) {
          const url = `../school_grade_cuts.json?t=${Date.now()}`;
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) cachedSchoolGradeCuts = await res.json();
        }
        renderGradeExams();
      } catch (e) { console.warn('시험 정보 fetch 실패:', e); }
    }
  }

  function renderGradeExams() {
    const wrap = document.getElementById('gradeInputSection');
    const s = studentData.student || {};
    // 학년 매핑 (학생의 현재 학년 이하의 모든 카드 표시)
    const ORDER = { '중1': 1, '중2': 2, '중3': 3, '고1': 1, '고2': 2, '고3': 3 };
    const studentType = (s.grade || '').charAt(0); // '중' 또는 '고'
    const studentLvl = ORDER[s.grade] || 99;

    const myEntries = (cachedSchoolGradeCuts || []).filter(c => {
      if (!c.school || c.school !== s.school) return false;
      const lvl = c.gradeLevel || '';
      // 같은 학교급(중/고)에서 본인 학년 이하만
      if (lvl && studentType) {
        if (lvl.charAt(0) !== studentType) return false;
        if ((ORDER[lvl] || 0) > studentLvl) return false;
      }
      const enabled = c.studentInputEnabledByExamKind || {};
      return Object.values(enabled).some(v => v === true);
    });

    // 정렬: 학년(낮→높) → 년도 → 학기 → 과목 (교과서 순서 기준)
    const SUBJECT_ORDER = ['공통수학1', '공통수학2', '대수', '미적분1', '확률과 통계', '기하', '미적분2'];
    myEntries.sort((a, b) => {
      const al = ORDER[a.gradeLevel] || 99, bl = ORDER[b.gradeLevel] || 99;
      if (al !== bl) return al - bl;
      if ((a.year || 0) !== (b.year || 0)) return (a.year || 0) - (b.year || 0);
      if (String(a.semester) !== String(b.semester)) return String(a.semester).localeCompare(String(b.semester));
      const ai = SUBJECT_ORDER.indexOf(a.subject), bi = SUBJECT_ORDER.indexOf(b.subject);
      if (ai !== bi) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      return 0;
    });

    if (myEntries.length === 0) { wrap.innerHTML = ''; return; }

    loadReflectionDrafts();
    const myGrades = (studentData || {}).myGrades || [];

    let html = `<div style="font-size:13px; color:var(--text2); margin:0 0 14px; line-height:1.6;">시험 결과와 반성을 함께 적어주세요. 등급컷은 선생님이 채웁니다.</div>`;

    for (const c of myEntries) {
      const enabled = c.studentInputEnabledByExamKind || {};
      const examKinds = ['중간','기말'].filter(ek => enabled[ek]);
      if (examKinds.length === 0) continue;
      const lvl = c.gradeLevel || '';
      const isMid = ['중1','중2','중3'].includes(lvl);

      html += `<div class="card" style="margin-bottom:14px; padding:14px; background:var(--surface); border-radius:10px; border:1px solid var(--border);">`;
      html += `<div style="font-weight:700; font-size:14px; margin-bottom:4px; letter-spacing:-0.2px;">${escapeHtml(c.subject || '')} <span style="color:var(--text3); font-weight:500;">· ${escapeHtml(lvl)} · ${c.year || '?'}-${c.semester || '?'}학기</span></div>`;
      if (c.extraNote) html += `<div style="font-size:11.5px; color:var(--text2); margin-bottom:8px; padding:6px 8px; background:var(--surface2); border-radius:5px; line-height:1.5;">💡 ${escapeHtml(c.extraNote)}</div>`;

      for (const ek of examKinds) {
        const draftKey = `${c.id}__${ek}`;
        const d = cachedLocalDrafts[draftKey] || {};
        const notes = (c.notesByExamKind || {})[ek] || '';
        const examInfo = (c.examInfoByExamKind || {})[ek] || '';

        // 이미 dashGrades에 입력된 점수가 있는지
        const matchedGrade = myGrades.find(g => g.type === 'naesin'
          && Number(g.year) === Number(c.year)
          && String(g.semester) === String(c.semester)
          && g.subject === c.subject && g.examKind === ek);
        const hasScore = matchedGrade && (matchedGrade.score != null || matchedGrade.grade != null);

        const reflectionDraftKey = `reflection__${c.id}__${ek}`;
        const reflectionFromGrade = matchedGrade ? (matchedGrade.reflection || '') : '';
        const currentReflection = (cachedReflectionDrafts[reflectionDraftKey] && cachedReflectionDrafts[reflectionDraftKey].text != null)
          ? cachedReflectionDrafts[reflectionDraftKey].text
          : reflectionFromGrade;

        // 점수 표시 또는 입력 폼
        let scoreBlock;
        if (hasScore) {
          // 이미 점수 채워짐 → 표시만
          const sc = matchedGrade.score, gd = matchedGrade.grade, rk = matchedGrade.rank, ts = matchedGrade.totalStudents;
          scoreBlock = `
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 10px; background:#f0f4f0; border:1px solid #d8e6d8; border-radius:6px;">
              ${sc != null ? `<span style="font-size:13px; font-weight:700; color:#2e5d2e;">${sc}점</span>` : ''}
              ${gd ? `<span style="display:inline-block; padding:2px 8px; background:${gradeColor(gd)}; color:#fff; border-radius:4px; font-size:11px; font-weight:700;">${gd}등급</span>` : ''}
              ${(rk && ts) ? `<span style="font-size:11px; color:var(--text2);">석차 ${rk}/${ts}</span>` : ''}
              <span style="margin-left:auto; font-size:10.5px; color:var(--text3);">입력됨</span>
            </div>
          `;
        } else {
          // 입력 폼
          scoreBlock = `
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:6px;">
              <div><label class="gi-label">원점수</label><input type="number" min="0" max="100" class="gi-input" data-key="${draftKey}" data-field="score" value="${d.score ?? ''}" placeholder="예: 88"></div>
              ${!isMid ? `<div><label class="gi-label">등급</label><select class="gi-input" data-key="${draftKey}" data-field="grade">
                <option value="">선택</option>
                ${[1,2,3,4,5,6,7,8,9].map(g => `<option value="${g}" ${String(d.grade)===String(g)?'selected':''}>${g}등급</option>`).join('')}
              </select></div>` : ''}
            </div>
            ${!isMid ? `
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px;">
                <div><label class="gi-label">석차</label><input type="number" min="1" class="gi-input" data-key="${draftKey}" data-field="rank" value="${d.rank ?? ''}" placeholder="3"></div>
                <div><label class="gi-label">전교 인원</label><input type="number" min="1" class="gi-input" data-key="${draftKey}" data-field="totalStudents" value="${d.totalStudents ?? ''}" placeholder="250"></div>
              </div>
            ` : ''}
          `;
        }

        html += `
          <div style="margin-top:12px; padding:12px; background:var(--surface2); border-radius:8px;">
            <div style="font-weight:600; color:#5a3a9e; margin-bottom:8px; font-size:13.5px;">${ek}</div>
            ${notes ? `<div style="font-size:11.5px; color:var(--text2); margin-bottom:6px;">범위: ${escapeHtml(notes)}</div>` : ''}
            ${examInfo ? `<div style="font-size:11.5px; color:var(--text2); margin-bottom:6px;">출제정보: ${escapeHtml(examInfo)}</div>` : ''}
            ${scoreBlock}
            <div style="margin-top:8px;">
              <label class="gi-label">반성 · 다짐</label>
              <textarea class="gi-input reflection-input" data-reflection-key="${reflectionDraftKey}" rows="3" placeholder="예: 계산 실수 많았음. 다음엔 검산 두 번 하자!">${escapeHtml(currentReflection)}</textarea>
            </div>
            ${(d.sentAt && !hasScore) ? `<div style="font-size:11px; color:var(--success); margin-top:6px; font-weight:600;">✓ ${formatRelativeTime(new Date(d.sentAt))} 선생님께 전송됨</div>` : ((d.savedAt && !hasScore) ? `<div style="font-size:11px; color:var(--text3); margin-top:6px;">저장됨 (아직 전송 안 함)</div>` : '')}
          </div>
        `;
      }
      html += `</div>`;
    }
    html += `
      <button class="make-note-btn" onclick="saveAllGradeInputs()">
        저장 · 선생님께 전송
      </button>
    `;
    wrap.innerHTML = html;

    wrap.querySelectorAll('.gi-input:not(.reflection-input)').forEach(el => {
      el.addEventListener('input', () => {
        const k = el.dataset.key;
        const f = el.dataset.field;
        if (!cachedLocalDrafts[k]) cachedLocalDrafts[k] = {};
        cachedLocalDrafts[k][f] = el.value;
        saveLocalDrafts();
      });
    });
    wrap.querySelectorAll('.reflection-input').forEach(el => {
      el.addEventListener('input', () => {
        const k = el.dataset.reflectionKey;
        if (!cachedReflectionDrafts[k]) cachedReflectionDrafts[k] = {};
        cachedReflectionDrafts[k].text = el.value;
        saveReflectionDrafts();
      });
    });
  }

  async function saveAllGradeInputs() {
    const submissions = [];
    // 점수 + 매칭되는 반성
    for (const k in cachedLocalDrafts) {
      const d = cachedLocalDrafts[k];
      const hasValue = (d.score && d.score !== '') || (d.grade && d.grade !== '') || (d.rank && d.rank !== '') || (d.totalStudents && d.totalStudents !== '');
      if (!hasValue) continue;
      const [entryId, examKind] = k.split('__');
      const entry = (cachedSchoolGradeCuts || []).find(c => c.id === entryId);
      if (!entry) continue;
      const reflectionKey = `reflection__${entryId}__${examKind}`;
      const reflection = (cachedReflectionDrafts[reflectionKey] && cachedReflectionDrafts[reflectionKey].text != null)
        ? cachedReflectionDrafts[reflectionKey].text : '';
      submissions.push({
        entryId, examKind,
        school: entry.school, gradeLevel: entry.gradeLevel,
        year: entry.year, semester: entry.semester, subject: entry.subject,
        score: d.score ? Number(d.score) : null,
        grade: d.grade ? Number(d.grade) : null,
        rank: d.rank ? Number(d.rank) : null,
        totalStudents: d.totalStudents ? Number(d.totalStudents) : null,
        reflection,
      });
    }
    // 반성만 적은 경우(점수 없음)
    for (const rk in cachedReflectionDrafts) {
      const rd = cachedReflectionDrafts[rk];
      if (!rd || !rd.text || rd.text === '') continue;
      const m = rk.match(/^reflection__(.+)__(중간|기말)$/);
      if (!m) continue;
      const entryId = m[1], examKind = m[2];
      if (submissions.some(s => s.entryId === entryId && s.examKind === examKind)) continue;
      const entry = (cachedSchoolGradeCuts || []).find(c => c.id === entryId);
      if (!entry) continue;
      submissions.push({
        entryId, examKind,
        school: entry.school, gradeLevel: entry.gradeLevel,
        year: entry.year, semester: entry.semester, subject: entry.subject,
        score: null, grade: null, rank: null, totalStudents: null,
        reflection: rd.text,
      });
    }
    if (submissions.length === 0) {
      alert('입력된 내용이 없습니다.');
      return;
    }
    if (!confirm(`${submissions.length}건의 성적/반성을 선생님께 전송합니다.\n진행할까요?`)) return;

    const payload = {
      studentCode,
      studentName: (studentData.student || {}).name || '',
      school: (studentData.student || {}).school || '',
      grade: (studentData.student || {}).grade || '',
      submittedAt: new Date().toISOString(),
      submissions,
    };

    try {
      const jsonStr = JSON.stringify(payload, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const file = new File([blob], `grade_${studentCode}_${Date.now()}.json`, { type: 'application/json' });
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('tags', `student_${studentCode},grade_submission`);
      formData.append('context', `student_code=${studentCode}|kind=grade_submission`);
      const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
      const res = await fetch(url, { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok || !data.secure_url) throw new Error((data.error && data.error.message) || '업로드 실패');

      const now = new Date().toISOString();
      for (const k in cachedLocalDrafts) {
        const d = cachedLocalDrafts[k];
        const hasValue = (d.score && d.score !== '') || (d.grade && d.grade !== '') || (d.rank && d.rank !== '') || (d.totalStudents && d.totalStudents !== '');
        if (hasValue) cachedLocalDrafts[k].sentAt = now;
      }
      for (const rk in cachedReflectionDrafts) {
        if (cachedReflectionDrafts[rk] && cachedReflectionDrafts[rk].text) cachedReflectionDrafts[rk].sentAt = now;
      }
      saveLocalDrafts();
      saveReflectionDrafts();
      renderGradeExams();
      alert(`✓ ${submissions.length}건을 선생님께 전송했습니다.`);
    } catch (e) {
      console.error(e);
      alert('전송 실패: ' + e.message);
    }
  }


  // 완료 노트: details/summary 토글 (과제 토글과 통일된 모양)
  function renderCompletedSection(items) {
    const INITIAL = 8;
    const recent = items.slice(0, INITIAL);
    const rest = items.slice(INITIAL);
    let inner = recent.map(it => renderNoteCard(it, 'completed', false)).join('');
    if (rest.length > 0) {
      inner += `<div id="completedRest" style="display:none;">${rest.map(it => renderNoteCard(it, 'completed', false)).join('')}</div>`;
      inner += `<button class="completed-more-btn" id="completedMoreBtn" onclick="toggleCompletedMore()">+ 이전 완료 ${rest.length}개 더 보기</button>`;
    }
    return `
      <details style="margin-top:12px;">
        <summary style="cursor:pointer; list-style:none; user-select:none;">
          <div style="width:66.67%; max-width:380px; margin:0 auto; padding:10px 14px; background:#e8f5e9; border:0.5px solid rgba(46,125,50,0.25); border-radius:10px; font-size:13px; font-weight:600; color:#2e7d32; text-align:center;">
            ✓ 최근 완료한 오답노트 ${items.length}건 보기
          </div>
        </summary>
        <div style="margin-top:10px;">${inner}</div>
      </details>
    `;
  }

  function toggleCompletedSection() {
    const body = document.getElementById('completedBody');
    const arrow = document.getElementById('completedArrow');
    if (!body) return;
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    if (arrow) arrow.textContent = open ? '▶' : '▼';
  }

  function toggleCompletedMore() {
    const rest = document.getElementById('completedRest');
    const btn = document.getElementById('completedMoreBtn');
    if (!rest || !btn) return;
    rest.style.display = 'block';
    btn.style.display = 'none';
  }

  function renderSection(title, items, type, emptyMsg, allowUpload) {
    let html = `<div class="section"><div class="section-title"><span>${title}</span>${items.length > 0 ? `<span class="section-count ${type}">${items.length}</span>` : ''}</div>`;
    if (items.length === 0) html += `<div class="empty-state">${emptyMsg}</div>`;
    else for (const item of items) html += renderNoteCard(item, type, allowUpload);
    html += '</div>';
    return html;
  }

  // 일반 과제 섹션
  function renderTaskSection(tasks) {
    if (!tasks || tasks.length === 0) return '';
    // 미확인(제출해야할 + 확인 대기) / 확인됨 분리
    const pending = [];
    const confirmed = [];
    for (const t of tasks) {
      const round = t.round || 1;
      const teacherInfo = getTeacherConfirm(t.assignmentId, round);
      const isConfirmed = !!(teacherInfo && teacherInfo.confirmed);
      if (isConfirmed) confirmed.push(t);
      else pending.push(t);
    }
    // 최근 순 정렬: dueDate 내림차순 (없으면 뒤로)
    const sortRecent = (a, b) => {
      const ad = a.dueDate || '';
      const bd = b.dueDate || '';
      if (!ad && bd) return 1;
      if (ad && !bd) return -1;
      return bd.localeCompare(ad);
    };
    pending.sort(sortRecent);
    confirmed.sort(sortRecent);

    let html = `<div class="section"><div class="section-title"><span>제출하거나 확인 대기 중인 과제</span><span class="section-count">${pending.length}</span></div>`;
    for (const t of pending) html += renderTaskCard(t);
    if (pending.length === 0) {
      html += `<div style="padding:14px; background:var(--surface2); border-radius:10px; color:var(--text3); font-size:13px; text-align:center;">제출하거나 확인 대기 중인 과제가 없습니다 👍</div>`;
    }
    if (confirmed.length > 0) {
      html += `
        <details style="margin-top:12px;">
          <summary style="cursor:pointer; list-style:none; user-select:none;">
            <div style="width:66.67%; max-width:380px; margin:0 auto; padding:10px 14px; background:#e8f5e9; border:0.5px solid rgba(46,125,50,0.25); border-radius:10px; font-size:13px; font-weight:600; color:#2e7d32; text-align:center;">
              ✓ 확인 완료된 과제 ${confirmed.length}건 보기
            </div>
          </summary>
          <div style="margin-top:10px;">${confirmed.map(renderTaskCard).join('')}</div>
        </details>
      `;
    }
    html += '</div>';
    return html;
  }

  function renderTaskCard(t) {
    // round는 서버 데이터에서 받음 (일반 과제=1, 반복 과제=날짜 YYYYMMDD)
    const round = t.round || 1;
    const sub = getSubmission(t.assignmentId, round);
    const teacherInfo = getTeacherConfirm(t.assignmentId, round);
    const isSubmitted = sub.photos && sub.photos.length > 0;
    const isConfirmed = !!(teacherInfo && teacherInfo.confirmed);
    const teacherComment = (teacherInfo && teacherInfo.comment) || '';

    let cardClass = 'task';
    if (isConfirmed) cardClass = 'confirmed';
    else if (isSubmitted) cardClass = 'submitted';

    const dueText = t.dueDate ? `${t.isRepeat ? '' : '마감 '}${formatTaskDueDate(t.dueDate)}` : '';
    let statusBadge = '';
    if (isConfirmed) statusBadge = '<span class="note-card-status confirmed">✓ 확인됨</span>';
    else if (isSubmitted) statusBadge = '<span class="note-card-status submitted">⏳ 확인 대기</span>';

    // 반복 과제 배지: 오늘이면 "오늘 과제", 아니면 날짜 표시
    let repeatBadge = '';
    if (t.isRepeat) {
      if (t.dayOffset === 0) repeatBadge = '<span class="note-card-date" style="color:#7c5cbf; font-weight:600;">🔁 오늘 과제</span>';
      else repeatBadge = '<span class="note-card-date" style="color:#7c5cbf;">🔁 반복</span>';
    }

    let html = `
      <div class="note-card ${cardClass}">
        <div class="note-card-title">${escapeHtml(t.title || '과제')}</div>
        <div class="note-card-meta">
          <span class="note-card-round task">과제</span>
          ${repeatBadge}
          ${dueText ? `<span class="note-card-date">${dueText}</span>` : ''}
          ${statusBadge}
        </div>
    `;
    if (teacherComment) {
      html += `<div class="teacher-comment"><div class="teacher-comment-label">📝 선생님 코멘트</div><div class="teacher-comment-body">${escapeHtml(teacherComment)}</div></div>`;
    }
    // 확인 전이면 업로드 가능
    if (!isConfirmed) html += renderUploadArea({ assignmentId: t.assignmentId, round: round }, sub);
    else if (isSubmitted) html += renderSubmittedPhotos({ assignmentId: t.assignmentId, round: round }, sub);
    html += '</div>';
    return html;
  }

  function formatTaskDueDate(dateStr) {
    const d = new Date(dateStr);
    const today = new Date(); today.setHours(0,0,0,0);
    const dd = new Date(dateStr); dd.setHours(0,0,0,0);
    const diffDays = Math.floor((dd - today) / 86400000);
    const days = ['일','월','화','수','목','금','토'];
    const base = `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
    if (diffDays === 0) return base + ' · 오늘까지';
    if (diffDays === 1) return base + ' · 내일까지';
    if (diffDays < 0) return base + ` · ${-diffDays}일 지남`;
    if (diffDays <= 7) return base + ` · ${diffDays}일 남음`;
    return base;
  }

  // 선생님이 확인한 정보 (서버에서 받은 데이터)
  function getTeacherConfirm(assignmentId, round) {
    const map = (studentData && studentData.teacherConfirms) || {};
    return map[`${assignmentId}__${round}`] || null;
  }

  function renderNoteCard(item, type, allowUpload) {
    const sub = getSubmission(item.assignmentId, item.round);
    const teacherInfo = getTeacherConfirm(item.assignmentId, item.round);
    const isSubmitted = sub.photos && sub.photos.length > 0;
    // 확인 여부는 선생님 데이터를 우선 (localStorage의 confirmedAt은 더 이상 사용 안 함)
    const isConfirmed = !!(teacherInfo && teacherInfo.confirmed);
    const teacherComment = (teacherInfo && teacherInfo.comment) || '';

    let cardClass = type;
    if (isConfirmed) cardClass = 'confirmed';
    else if (isSubmitted) cardClass = 'submitted';
    const roundClass = type === 'completed' ? 'completed' : (type === 'overdue' ? 'overdue' : (type === 'upcoming' ? 'upcoming' : ''));
    const dateDisplay = type === 'today' ? '오늘' : type === 'overdue' ? formatOverdueDate(item.plannedDate) : type === 'upcoming' ? formatUpcomingDate(item.plannedDate) : type === 'completed' ? (item.doneAt ? formatCompletedDate(item.doneAt) : '') : '';
    let statusBadge = '';
    if (isConfirmed) statusBadge = '<span class="note-card-status confirmed">✓ 확인됨</span>';
    else if (isSubmitted) statusBadge = '<span class="note-card-status submitted">⏳ 확인 대기</span>';

    let html = `
      <div class="note-card ${cardClass}">
        <div class="note-card-title">${escapeHtml(item.noteName || '오답노트')}</div>
        <div class="note-card-meta">
          <span class="note-card-round ${roundClass}">${item.round}차</span>
          <span class="note-card-date">${dateDisplay}</span>
          ${statusBadge}
        </div>
    `;
    // 선생님 코멘트 표시 (있으면 항상)
    if (teacherComment) {
      html += `<div class="teacher-comment"><div class="teacher-comment-label">📝 선생님 코멘트</div><div class="teacher-comment-body">${escapeHtml(teacherComment)}</div></div>`;
    }
    if (allowUpload && type !== 'completed' && !isConfirmed) html += renderUploadArea(item, sub);
    else if (isSubmitted) html += renderSubmittedPhotos(item, sub);
    html += '</div>';
    return html;
  }

  function renderUploadArea(item, sub) {
    const photos = sub.photos || [];
    let html = '<div class="upload-area">';
    if (photos.length > 0) {
      html += '<div class="photo-grid">';
      for (let i = 0; i < photos.length; i++) {
        const p = photos[i];
        if (p.uploading) {
          html += `<div class="photo-item uploading"><div class="photo-spinner"></div></div>`;
        } else {
          html += `<div class="photo-item"><img src="${p.url}" alt="" onclick="openPhotoViewer('${p.url}')"><button class="photo-delete" onclick="deletePhoto('${item.assignmentId}', ${item.round}, ${i})" title="삭제">×</button></div>`;
        }
      }
      html += '</div>';
    }
    if (photos.length === 0) {
      html += `<button class="upload-btn" onclick="selectPhotos('${item.assignmentId}', ${item.round})">📷 다 풀었어요! 사진 올리기</button>`;
    } else {
      html += `
        <button class="upload-btn secondary" onclick="selectPhotos('${item.assignmentId}', ${item.round})">+ 사진 더 추가</button>
        <div class="submit-status info">⏳ ${photos.filter(p => !p.uploading).length}장 제출 완료. 선생님 확인 전엔 추가/삭제 가능합니다.</div>
      `;
    }
    html += '</div>';
    return html;
  }

  function renderSubmittedPhotos(item, sub) {
    const photos = sub.photos || [];
    if (photos.length === 0) return '';
    let html = '<div class="upload-area"><div class="photo-grid">';
    for (const p of photos) {
      if (!p.uploading) html += `<div class="photo-item"><img src="${p.url}" alt="" onclick="openPhotoViewer('${p.url}')"></div>`;
    }
    html += '</div></div>';
    return html;
  }

  function renderError(title, text) {
    document.getElementById('app').innerHTML = `
      <div class="header">
        <div class="header-brand">생각의 흐름 · 기억의 설계</div>
        <div class="header-tagline">잊지 않게 만드는 수학 학습</div>
      </div>
      <div class="error-state">
        <div class="error-icon">😕</div>
        <div class="error-title">${escapeHtml(title)}</div>
        <div class="error-text">${text}</div>
      </div>
    `;
  }

  let pendingUploadContext = null;
  function selectPhotos(assignmentId, round) {
    pendingUploadContext = { assignmentId, round };
    const input = document.getElementById('photoInput');
    input.value = '';
    input.click();
  }

  document.getElementById('photoInput').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0 || !pendingUploadContext) return;
    const ctx = pendingUploadContext;
    pendingUploadContext = null;
    await uploadPhotos(ctx.assignmentId, ctx.round, files);
  });

  async function uploadPhotos(assignmentId, round, files) {
    const sub = getSubmission(assignmentId, round);
    const photos = sub.photos || [];
    showToast(`📤 ${files.length}장 업로드 중...`);

    const tempIds = [];
    for (const _ of files) {
      const tempId = 'temp_' + Date.now() + '_' + Math.random();
      tempIds.push(tempId);
      photos.push({ url: '', publicId: tempId, uploadedAt: new Date().toISOString(), uploading: true });
    }
    setSubmission(assignmentId, round, { ...sub, photos });
    renderPage();

    let successCount = 0;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const tempId = tempIds[i];
      try {
        const result = await uploadToCloudinary(file, assignmentId, round);
        const currentSub = getSubmission(assignmentId, round);
        const currentPhotos = currentSub.photos || [];
        const idx = currentPhotos.findIndex(p => p.publicId === tempId);
        if (idx !== -1) {
          currentPhotos[idx] = { url: result.secure_url, publicId: result.public_id, uploadedAt: new Date().toISOString() };
          setSubmission(assignmentId, round, { ...currentSub, photos: currentPhotos, submittedAt: currentSub.submittedAt || new Date().toISOString() });
          successCount++;
        }
      } catch (e) {
        console.error('업로드 실패:', e);
        const currentSub = getSubmission(assignmentId, round);
        const currentPhotos = (currentSub.photos || []).filter(p => p.publicId !== tempId);
        setSubmission(assignmentId, round, { ...currentSub, photos: currentPhotos });
      }
      renderPage();
    }

    if (successCount === files.length) showToast(`✅ ${successCount}장 업로드 완료`);
    else if (successCount > 0) showToast(`⚠️ ${successCount}/${files.length}장만 성공 (일부 실패)`);
    else showToast('❌ 업로드 실패. 인터넷 확인 후 다시 시도해주세요.', 4000);
  }

  async function uploadToCloudinary(file, assignmentId, round) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    formData.append('context', `student_code=${studentCode}|assignment_id=${assignmentId}|round=${round}|submitted_at=${new Date().toISOString()}`);
    formData.append('tags', `student_${studentCode},assignment_${assignmentId},round_${round}`);
    const res = await fetch(CLOUDINARY_UPLOAD_URL, { method: 'POST', body: formData });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`Cloudinary 응답 오류 ${res.status}: ${text}`);
    }
    return await res.json();
  }

  async function deletePhoto(assignmentId, round, index) {
    if (!confirm('이 사진을 삭제할까요?')) return;
    const sub = getSubmission(assignmentId, round);
    const photos = sub.photos || [];
    if (index < 0 || index >= photos.length) return;
    photos.splice(index, 1);
    setSubmission(assignmentId, round, { ...sub, photos });
    renderPage();
    showToast('삭제됨');
  }

  function openPhotoViewer(url) {
    document.getElementById('photoViewerImg').src = url;
    document.getElementById('photoViewer').classList.add('active');
  }
  function closePhotoViewer() {
    document.getElementById('photoViewer').classList.remove('active');
    document.getElementById('photoViewerImg').src = '';
  }

  let toastTimer = null;
  function showToast(msg, duration = 2500) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    if (toastTimer) clearTimeout(toastTimer);
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    toastTimer = setTimeout(() => t.remove(), duration);
  }

  function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function formatDateRange(start, end) { if (!start || !end) return ''; const s = new Date(start), e = new Date(end); return `${s.getMonth()+1}/${s.getDate()} ~ ${e.getMonth()+1}/${e.getDate()}`; }
  function formatOverdueDate(dateStr) { const today = new Date(); today.setHours(0,0,0,0); const d = new Date(dateStr); const diffDays = Math.floor((today - d) / 86400000); if (diffDays === 1) return '어제'; if (diffDays <= 7) return `${diffDays}일 전`; return `${d.getMonth()+1}/${d.getDate()}`; }
  function formatUpcomingDate(dateStr) { const today = new Date(); today.setHours(0,0,0,0); const d = new Date(dateStr); const diffDays = Math.floor((d - today) / 86400000); const days = ['일','월','화','수','목','금','토']; if (diffDays === 1) return '내일'; if (diffDays <= 6) return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`; return `${d.getMonth()+1}/${d.getDate()}`; }
  function formatCompletedDate(isoStr) { const d = new Date(isoStr); const today = new Date(); today.setHours(0,0,0,0); d.setHours(0,0,0,0); const diffDays = Math.floor((today - d) / 86400000); if (diffDays === 0) return '오늘 완료'; if (diffDays === 1) return '어제 완료'; if (diffDays <= 7) return `${diffDays}일 전 완료`; return `${d.getMonth()+1}/${d.getDate()} 완료`; }
  function formatRelativeTime(d) { const now = new Date(); const diff = Math.floor((now - d) / 1000); if (diff < 60) return '방금 전'; if (diff < 3600) return `${Math.floor(diff/60)}분 전`; if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`; return `${Math.floor(diff/86400)}일 전`; }

  // 해시 변경 시 화면 전환
  window.addEventListener('hashchange', () => {
    if (studentData) renderPage();
  });
</script>
</body>
</html>
