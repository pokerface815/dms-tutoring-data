  // 시청 기록 렌더 — 최근 시청한 영상부터 평면 목록
  function renderLectureHistoryInline() {
    const wrap = document.getElementById('lectureListWrap');
    if (!wrap) return;
    const watch = loadLectureWatch();
    const lectures = (_lecturesCache || []).filter(hasLecturePermission);
    const lecMap = {};
    for (const lec of lectures) lecMap[lec.id] = lec;

    // 영상별 entry 만들기 (권한 있는 강의의 영상만)
    const entries = [];
    for (const vid in watch) {
      const w = watch[vid];
      if (!w || !w.lectureId || !lecMap[w.lectureId]) continue;
      const lec = lecMap[w.lectureId];
      const v = (lec.videos || []).find(vv => vv.videoId === vid);
      if (!v) continue;
      entries.push({
        videoId: vid,
        videoTitle: v.title || w.videoTitle || vid,
        lectureId: lec.id,
        lectureTitle: lec.title,
        lectureSubject: lec.subject || '',
        thumbnailUrl: lec.thumbnailUrl || '',
        watchedSec: w.watchedSec || 0,
        durationSec: v.durationSec || w.durationSec || 0,
        lastWatchedAt: w.lastWatchedAt || '',
        lastPosition: w.lastPosition || 0,
      });
    }
    // 마지막 시청 일시 내림차순
    entries.sort((a, b) => (b.lastWatchedAt || '').localeCompare(a.lastWatchedAt || ''));

    if (entries.length === 0) {
      wrap.innerHTML = `
        <div class="lecture-empty">
          <div class="ico">🕒</div>
          <h3>시청 기록이 없어요</h3>
          <p>강의 목록에서 영상을 시청하면<br>여기에 표시됩니다.</p>
        </div>
      `;
      return;
    }

    // 친화적 시간 포맷
    const friendlyTime = (iso) => {
      if (!iso) return '';
      const ts = new Date(iso).getTime();
      const diff = Date.now() - ts;
      const min = diff / 60000, hr = min / 60, day = hr / 24;
      if (min < 60) return `${Math.max(1, Math.floor(min))}분 전`;
      if (hr < 24) return `${Math.floor(hr)}시간 전`;
      if (day < 2) return '어제';
      if (day < 7) return `${Math.floor(day)}일 전`;
      return new Date(iso).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
    };

    let html = '';
    for (const e of entries) {
      const pct = e.durationSec > 0 ? Math.min(100, Math.round(e.watchedSec / e.durationSec * 100)) : 0;
      const isDone = pct >= 80;
      const isResume = e.lastPosition > 5 && (e.durationSec === 0 || e.lastPosition < e.durationSec - 10);
      const statusBadge = isDone
        ? `<span class="hist-badge hist-badge-done">완료</span>`
        : (isResume ? `<span class="hist-badge hist-badge-resume">이어보기</span>` : `<span class="hist-badge hist-badge-progress">진행 중</span>`);
      html += `
        <div class="hist-item">
          <div class="hist-clickable" onclick="openLecturePlayerById('${e.lectureId}', '${e.videoId}')">
            ${e.thumbnailUrl
              ? `<img class="hist-thumb" src="${escapeHtml(e.thumbnailUrl)}" alt="" loading="lazy">`
              : `<div class="hist-thumb" style="display:flex; align-items:center; justify-content:center; font-size:20px;">🎬</div>`}
            <div class="hist-info">
              <div class="hist-title">${escapeHtml(e.videoTitle)}</div>
              <div class="hist-sub">
                <span class="hist-lecture">${escapeHtml(e.lectureTitle)}</span>
              </div>
              <div class="hist-meta">
                ${statusBadge}
                <span class="hist-time">${fmtLectureDur(e.watchedSec)} / ${fmtLectureDurLong(e.durationSec)}</span>
                <span class="hist-last">${friendlyTime(e.lastWatchedAt)}</span>
              </div>
              <div class="hist-progress"><div style="width:${pct}%;"></div></div>
            </div>
          </div>
          <button class="hist-del-btn" onclick="event.stopPropagation(); deleteLectureWatchEntry('${e.videoId}')" title="시청 기록 삭제">×</button>
        </div>
      `;
    }
    wrap.innerHTML = html;
  }

  // 시청 기록 1건 삭제 (해당 영상의 watch 데이터 제거)
  window.deleteLectureWatchEntry = function(videoId) {
    if (!confirm('이 시청 기록을 삭제할까요?')) return;
    const watch = loadLectureWatch();
    if (watch[videoId]) {
      delete watch[videoId];
      saveLectureWatch(watch);
    }
    // tombstone에 추가 (다른 기기에서 받아온 데이터로 부활 차단)
    addDeletedLectureWatchId(videoId);
    // 일별 시청도 같이 정리 (이 videoId에 해당하는 일별 데이터)
    try {
      const daily = JSON.parse(localStorage.getItem(`lectureDaily__${studentCode}`) || '{}');
      let changed = false;
      for (const date in daily) {
        if (daily[date] && daily[date][videoId]) {
          delete daily[date][videoId];
          if (Object.keys(daily[date]).length === 0) delete daily[date];
          changed = true;
        }
      }
      if (changed) localStorage.setItem(`lectureDaily__${studentCode}`, JSON.stringify(daily));
    } catch(e) {}
    // 동기화: 다음 자동 업로드 시 반영되도록 dirty 마킹
    if (typeof markLectureWatchDirty === 'function') markLectureWatchDirty();
    renderLectureHistoryInline();
  };

  // 시청 기록에서 영상 클릭 → 플레이어 열기
  window.openLecturePlayerById = function(lecId, videoId) {
    const lec = (_lecturesCache || []).find(l => l.id === lecId);
    if (!lec) { alert('강의 정보를 찾을 수 없습니다.'); return; }
    const v = (lec.videos || []).find(vv => vv.videoId === videoId);
    if (!v) { alert('영상 정보를 찾을 수 없습니다.'); return; }
    openLecturePlayer(lec.id, v.videoId);
  };

  // 과목 순서 (통합본 dashSubjects와 동일)
  const SUBJECT_ORDER = ['중1', '중2', '중3', '공통수학1', '공통수학2', '대수', '미적분Ⅰ', '미적분Ⅱ', '확률과 통계', '기하', '기타'];

  // 펼쳐진 과목 그룹 상태 (localStorage 저장)
  const LECTURE_SUBJECT_OPEN_KEY = 'odapNote_lectureSubjectOpen_v1';
  function loadOpenSubjects() {
    try { return JSON.parse(localStorage.getItem(LECTURE_SUBJECT_OPEN_KEY) || '[]'); }
    catch(e) { return []; }
  }
  function saveOpenSubjects(arr) {
    try { localStorage.setItem(LECTURE_SUBJECT_OPEN_KEY, JSON.stringify(arr)); } catch(e) {}
  }

  window.toggleLectureSubject = function(subj) {
    const open = new Set(loadOpenSubjects());
    if (open.has(subj)) open.delete(subj);
    else open.add(subj);
    saveOpenSubjects(Array.from(open));
    renderLectureListInline();
  };

  function renderLectureListInline() {
    const wrap = document.getElementById('lectureListWrap');
    if (!wrap) return;
    const lectures = (_lecturesCache || []).filter(hasLecturePermission);
    if (lectures.length === 0) {
      wrap.innerHTML = `
        <div class="lecture-empty">
          <div class="ico">🎬</div>
          <h3>아직 강의 영상이 없어요</h3>
          <p>선생님이 강의 영상을 등록하면<br>여기에 표시됩니다.</p>
        </div>
      `;
      return;
    }
    const watch = loadLectureWatch();

    // 과목별 그룹화 (재생목록은 원래 순서 유지 — 통합본에서 드래그로 정한 순서)
    const bySubject = {};
    for (const lec of lectures) {
      const k = lec.subject || '기타';
      if (!bySubject[k]) bySubject[k] = [];
      bySubject[k].push(lec);
    }

    // 과목 순서: SUBJECT_ORDER 따르되, 그 외는 끝에 알파벳 순으로
    const knownSubjects = SUBJECT_ORDER.filter(s => bySubject[s]);
    const otherSubjects = Object.keys(bySubject)
      .filter(s => !SUBJECT_ORDER.includes(s))
      .sort((a, b) => a.localeCompare(b, 'ko'));
    const subjects = [...knownSubjects, ...otherSubjects];

    const openSet = new Set(loadOpenSubjects());

    let html = '';
    for (const subj of subjects) {
      const lecs = bySubject[subj];
      const isOpen = openSet.has(subj);
      // 과목별 통계
      let totalVideoCount = 0, totalSec = 0, watchedSecSum = 0, totalWatchableSec = 0;
      let totalWatchedCount = 0;  // 50% 이상 시청한 영상 수 (durationSec 누락 폴백용)
      let totalVideosWithDuration = 0;
      let hasAnyWatched = false;
      for (const lec of lecs) {
        const videos = lec.videos || [];
        totalVideoCount += videos.length;
        for (const v of videos) {
          const dur = v.durationSec || 0;
          totalSec += dur;
          totalWatchableSec += dur;
          if (dur > 0) totalVideosWithDuration++;
          const w = watch[v.videoId];
          if (w && (w.watchedSec || 0) > 0) {
            hasAnyWatched = true;
            watchedSecSum += Math.min(w.watchedSec || 0, dur || w.watchedSec || 0);
            // durationSec 누락 시 폴백: w.durationSec 사용
            if (dur === 0 && w.durationSec > 0) {
              const ratio = (w.watchedSec || 0) / w.durationSec;
              if (ratio >= 0.5) totalWatchedCount++;
            } else if (dur > 0) {
              const ratio = (w.watchedSec || 0) / dur;
              if (ratio >= 0.5) totalWatchedCount++;
            }
          }
        }
      }
      // 진행률 계산 — durationSec 기반이 우선, 누락 시 영상 수 비율로 폴백
      let progressPct = 0;
      if (totalWatchableSec > 0) {
        progressPct = Math.round(watchedSecSum / totalWatchableSec * 100);
      } else if (totalVideoCount > 0 && totalWatchedCount > 0) {
        progressPct = Math.round(totalWatchedCount / totalVideoCount * 100);
      }

      html += `
        <div class="lecture-subj-group ${isOpen ? 'open' : ''}">
          <button class="lecture-subj-header" onclick="toggleLectureSubject('${subj.replace(/'/g, "\\'")}')">
            <span class="lecture-subj-arrow">▶</span>
            <span class="lecture-subj-name">${escapeHtml(subj)}</span>
            <span class="lecture-subj-count">재생목록 ${lecs.length}개</span>
            <span class="lecture-subj-progress">${hasAnyWatched ? `진행 ${progressPct}%` : ''}</span>
          </button>
          <div class="lecture-subj-body">
      `;
      // body 안의 카드는 펼쳐졌을 때만 렌더 (메모리 절약 + 진입 속도)
      if (isOpen) {
        for (const lec of lecs) {
          const videos = lec.videos || [];
          const tSec = videos.reduce((s, v) => s + (v.durationSec || 0), 0);
          let watchedCount = 0;
          for (const v of videos) {
            const w = watch[v.videoId];
            if (w) {
              const dur = v.durationSec || 1;
              if ((w.watchedSec || 0) / dur >= 0.5) watchedCount++;
            }
          }
          const lecProgress = videos.length > 0 ? Math.round(watchedCount / videos.length * 100) : 0;
          html += `
            <a class="lecture-list-card" href="#video/${encodeURIComponent(lec.id)}">
              ${lec.thumbnailUrl ? `<img class="lecture-list-thumb" src="${escapeHtml(lec.thumbnailUrl)}" alt="" loading="lazy">` : `<div class="lecture-list-thumb" style="display:flex; align-items:center; justify-content:center; font-size:24px;">🎬</div>`}
              <div class="lecture-list-info">
                <div class="lecture-list-title">${escapeHtml(lec.title)}</div>
                <div class="lecture-list-meta">
                  <span>📹 <b>${videos.length}</b>개</span>
                  <span>⏱ <b>${fmtLectureDurLong(tSec)}</b></span>
                  ${watchedCount > 0 ? `<span>✓ <b>${watchedCount}/${videos.length}</b>완료</span>` : ''}
                </div>
                <div class="lecture-list-progress"><div style="width:${lecProgress}%;"></div></div>
              </div>
            </a>
          `;
        }
      }
      html += `</div></div>`;
    }
    wrap.innerHTML = html;
  }

  // ===== 영상 목록 (재생목록 상세) =====
  function renderLectureDetailView(data, lecId) {
    return `<h2 class="view-title">강의 영상</h2><div id="lectureDetailWrap"></div>`;
  }

  function renderLectureDetailInline(lecId) {
    const wrap = document.getElementById('lectureDetailWrap');
    if (!wrap) return;
    const lec = (_lecturesCache || []).find(l => l.id === lecId);
    if (!lec) {
      wrap.innerHTML = `<div class="lecture-empty"><div class="ico">⚠</div><h3>재생목록을 찾을 수 없어요</h3><p>다시 시도하거나 새로고침해주세요.</p></div>`;
      return;
    }
    if (!hasLecturePermission(lec)) {
      wrap.innerHTML = `<div class="lecture-empty"><div class="ico">🔒</div><h3>접근 권한이 없어요</h3><p>선생님께 문의해주세요.</p></div>`;
      return;
    }
    const watch = loadLectureWatch();
    const videos = (lec.videos || []).slice().sort((a, b) => (a.position || 0) - (b.position || 0));
    const totalSec = videos.reduce((s, v) => s + (v.durationSec || 0), 0);

    let html = `
      <div class="lecture-detail-head">
        ${lec.thumbnailUrl ? `<img class="lecture-detail-thumb" src="${escapeHtml(lec.thumbnailUrl)}" alt="">` : ''}
        <div style="flex:1; min-width:0;">
          <div class="lecture-detail-title">${escapeHtml(lec.title)}</div>
          <div class="lecture-detail-meta">영상 ${videos.length}개 · 총 ${fmtLectureDurLong(totalSec)}${lec.subject ? ' · ' + escapeHtml(lec.subject) : ''}</div>
        </div>
      </div>
    `;

    if (videos.length === 0) {
      html += `<div class="lecture-empty"><div class="ico">📭</div><h3>영상이 없어요</h3></div>`;
      wrap.innerHTML = html;
      return;
    }

    html += `<div class="lecture-video-list">`;
    videos.forEach((v, i) => {
      const w = watch[v.videoId] || {};
      const dur = v.durationSec || 0;
      const watched = w.watchedSec || 0;
      const lastPos = w.lastPosition || 0;
      const pct = dur > 0 ? Math.min(100, Math.round(watched / dur * 100)) : 0;
      let statusClass = '', statusLabel = '';
      if (pct >= 80) { statusClass = 'watched'; statusLabel = '✓ 완료'; }
      else if (pct > 0) { statusClass = 'partial'; statusLabel = `${pct}%`; }
      const ytThumb = `https://i.ytimg.com/vi/${encodeURIComponent(v.videoId)}/mqdefault.jpg`;
      html += `
        <div class="lecture-video-item ${pct >= 80 ? 'watched' : ''}" onclick="openLecturePlayer('${escapeHtml(lec.id)}', '${escapeHtml(v.videoId)}')">
          <span class="lecture-video-num">${i+1}</span>
          <img class="lecture-video-thumb" src="${escapeHtml(ytThumb)}" alt="" loading="lazy">
          <div class="lecture-video-body">
            <div class="lecture-video-name">${escapeHtml(v.title)}</div>
            <div class="lecture-video-info">
              <span>${fmtLectureDur(dur)}</span>
              ${statusLabel ? `<span class="lecture-video-status ${statusClass}">${statusLabel}</span>` : ''}
              ${lastPos > 5 && pct < 80 ? `<span>이어보기 ${fmtLectureDur(lastPos)}</span>` : ''}
            </div>
            ${pct > 0 ? `<div class="lecture-video-prog"><div style="width:${pct}%;"></div></div>` : ''}
          </div>
          <button class="lecture-video-play" aria-label="재생">▶</button>
        </div>
      `;
    });
    html += `</div>`;
    wrap.innerHTML = html;
  }

  // ===== YouTube IFrame API =====
  function ensureYouTubeApiLoaded() {
    if (_ytApiReady || _ytApiLoading) return;
    if (window.YT && window.YT.Player) { _ytApiReady = true; return; }
    _ytApiLoading = true;
    // 글로벌 콜백 등록
    window.onYouTubeIframeAPIReady = function() {
      _ytApiReady = true;
      _ytApiLoading = false;
      console.log('[YT API] 준비 완료');
    };
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }

  // ===== 플레이어 모달 열기 =====
  window.openLecturePlayer = function(lecId, videoId) {
    const lec = (_lecturesCache || []).find(l => l.id === lecId);
    if (!lec) return;
    const v = (lec.videos || []).find(vv => vv.videoId === videoId);
    if (!v) return;

    _ytPlayerCurrent = {
      lecId, videoId,
      lectureTitle: lec.title || '',
      videoTitle: v.title || '',
      durationSec: v.durationSec || 0,
    };
    _ytLastTickTime = 0;

    // 이어보기 위치
    const watch = loadLectureWatch();
    const w = watch[videoId] || {};
    const startSec = (w.lastPosition && w.lastPosition > 5 && (v.durationSec === 0 || w.lastPosition < v.durationSec - 10))
      ? Math.floor(w.lastPosition)
      : 0;

    // 이번 세션 시작 시점의 누적 시청 시간 기록 (닫을 때 차이로 이번 세션 시청량 계산)
    _ytPlayerCurrent.sessionStartWatchedSec = w.watchedSec || 0;
    _ytPlayerCurrent.sessionStartedAt = Date.now();
    _ytPlayerCurrent.startSec = startSec;  // onReady에서 명시적 seekTo 위해

    // session count + 1
    if (!w.sessionCount) w.sessionCount = 0;
    w.sessionCount += 1;
    watch[videoId] = w;
    saveLectureWatch(watch);

    // 모달 DOM
    let modal = document.getElementById('lecturePlayerModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'lecturePlayerModal';
      modal.className = 'lecture-player-backdrop';
      document.body.appendChild(modal);
    }
    modal.innerHTML = `
      <div class="lecture-player-modal">
        <div class="lecture-player-head">
          <div class="lecture-player-title">${escapeHtml(v.title || '')}</div>
          <button class="lecture-player-close" onclick="closeLecturePlayer()" aria-label="닫기">×</button>
        </div>
        <div class="lecture-player-frame"><div id="ytPlayerContainer"></div></div>
        <div class="lecture-player-foot">
          <span class="label">시청</span>
          <span id="lecturePlayerWatched">${fmtLectureDur(w.watchedSec || 0)}</span>
          <span style="margin-left:auto; color:var(--text3);">${escapeHtml(lec.title || '')}</span>
        </div>
      </div>
    `;
    modal.classList.add('active');

    // API 준비 후 플레이어 생성
    const createPlayer = () => {
      try {
        _ytPlayer = new YT.Player('ytPlayerContainer', {
          width: '100%', height: '100%',
          videoId: videoId,
          playerVars: {
            playsinline: 1,
            rel: 0,
            modestbranding: 1,
            start: startSec,
          },
          events: {
            onReady: onYtPlayerReady,
            onStateChange: onYtPlayerStateChange,
            onError: (e) => console.warn('[YT Player] 오류:', e.data),
          },
        });
      } catch (e) {
        console.warn('[YT Player] 생성 실패:', e);
      }
    };
    if (_ytApiReady && window.YT && window.YT.Player) {
      createPlayer();
    } else {
      ensureYouTubeApiLoaded();
      const wait = setInterval(() => {
        if (_ytApiReady && window.YT && window.YT.Player) {
          clearInterval(wait);
          createPlayer();
        }
      }, 200);
      // 안전 가드 (10초 후 포기)
      setTimeout(() => clearInterval(wait), 10000);
    }
  };

  window.closeLecturePlayer = function() {
    // 마지막 위치 저장
    if (_ytPlayer && _ytPlayerCurrent) {
      try {
        const cur = _ytPlayer.getCurrentTime();
        applyLectureTick(cur, true);
      } catch(e) {}
    }
    stopLectureTick();
    if (_ytPlayer) {
      try { _ytPlayer.destroy(); } catch(e) {}
      _ytPlayer = null;
    }

    // 이번 세션에서 시청한 시간 계산 → 60초 이상이면 노력의 자취 기록 제안
    const sessionInfo = _ytPlayerCurrent ? (() => {
      const watch = loadLectureWatch();
      const wv = watch[_ytPlayerCurrent.videoId] || {};
      const sessionSec = (wv.watchedSec || 0) - (_ytPlayerCurrent.sessionStartWatchedSec || 0);
      return {
        sessionSec,
        sessionStartedAt: _ytPlayerCurrent.sessionStartedAt || Date.now(),
        lecId: _ytPlayerCurrent.lecId,
        lectureTitle: _ytPlayerCurrent.lectureTitle,
        videoTitle: _ytPlayerCurrent.videoTitle,
      };
    })() : null;

    _ytPlayerCurrent = null;
    const modal = document.getElementById('lecturePlayerModal');
    if (modal) {
      modal.classList.remove('active');
      modal.innerHTML = '';
    }
    // 영상 목록 다시 그리기 (진행률 갱신)
    const fullHash = (location.hash || '').replace('#', '');
    const detail = fullHash.startsWith('video/') ? fullHash.slice('video/'.length) : '';
    if (detail) renderLectureDetailInline(detail);
    else renderLectureListInline();

    // 노력의 자취 기록 제안 (60초 이상 시청한 경우)
    if (sessionInfo && sessionInfo.sessionSec >= 60) {
      // 모달 갱신 직후 떠야 자연스럽게 보임
      setTimeout(() => offerEffortLogFromVideo(sessionInfo), 200);
    }
  };

  function onYtPlayerReady(e) {
    // 이어보기: 명시적 seekTo (playerVars.start만으로는 일부 환경에서 작동 안 함)
    try {
      const startSec = _ytPlayerCurrent?.startSec || 0;
      if (startSec > 0) {
        e.target.seekTo(startSec, true);
      }
    } catch(err) { console.warn('[YT Player] seekTo 실패:', err); }
    // 자동 재생 시도 (브라우저 정책에 따라 muted 후 재생되거나 사용자 탭 필요)
    try { e.target.playVideo(); } catch(err) {}
  }

  function onYtPlayerStateChange(e) {
    const state = e.data;
    if (state === YT.PlayerState.PLAYING) {
      _ytLastTickTime = (typeof e.target.getCurrentTime === 'function') ? e.target.getCurrentTime() : 0;
      startLectureTick();
    } else if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.BUFFERING) {
      // 일시 중지: 마지막 위치 저장 + tick 정지
      stopLectureTick();
      try { applyLectureTick(e.target.getCurrentTime(), true); } catch(err) {}
    } else if (state === YT.PlayerState.ENDED) {
      stopLectureTick();
      try {
        const dur = e.target.getDuration() || _ytPlayerCurrent?.durationSec || 0;
        applyLectureTick(dur, true);
      } catch(err) {}
    }
  }

  function startLectureTick() {
    if (_ytPlayerTickTimer) return;
    _ytPlayerTickTimer = setInterval(() => {
      if (!_ytPlayer || !_ytPlayerCurrent) { stopLectureTick(); return; }
      try {
        const cur = _ytPlayer.getCurrentTime();
        applyLectureTick(cur, false);
      } catch(e) { stopLectureTick(); }
    }, 1000);
  }
  function stopLectureTick() {
    if (_ytPlayerTickTimer) { clearInterval(_ytPlayerTickTimer); _ytPlayerTickTimer = null; }
  }

  // currentTime을 받아 watchedSec / lastPosition 업데이트 + UI 갱신 + 동기화 마킹
  function applyLectureTick(curTime, forceSync) {
    if (!_ytPlayerCurrent) return;
    const { videoId, lecId, videoTitle, lectureTitle, durationSec } = _ytPlayerCurrent;
    const watch = loadLectureWatch();
    if (!watch[videoId]) watch[videoId] = { watchedSec: 0, lastPosition: 0, sessionCount: 1, lectureId: lecId, lectureTitle, videoTitle, durationSec };
    const w = watch[videoId];
    w.lectureId = lecId;
    w.lectureTitle = lectureTitle;
    w.videoTitle = videoTitle;
    w.durationSec = durationSec || w.durationSec || 0;
    w.lastPosition = Math.floor(curTime);
    w.lastWatchedAt = new Date().toISOString();
    // 직전 tick 시각과 비교 — 정상 재생인 경우 (0~3초 차이)만 누적
    const delta = curTime - _ytLastTickTime;
    if (delta > 0 && delta < 3.5) {
      const deltaInt = Math.round(delta);
      w.watchedSec = (w.watchedSec || 0) + deltaInt;
      // 일별 누적 — 요일별 통계용
      recordDailyLectureWatch(videoId, deltaInt);
    }
    _ytLastTickTime = curTime;
    saveLectureWatch(watch);

    // UI 업데이트 (재생 중 표시)
    const lab = document.getElementById('lecturePlayerWatched');
    if (lab) lab.textContent = fmtLectureDur(w.watchedSec || 0);

    // Cloudinary 동기화 dirty 마킹
    markLectureWatchDirty();
  }

  // ===== Cloudinary 자동 업로드 (학습 기록 패턴과 동일) =====
  function markLectureWatchDirty() {
    const sync = loadLectureSync();
    saveLectureSync({ ...sync, pending: true, dirtyAt: new Date().toISOString() });
    _lectureSyncStatus = 'pending';
    _lectureSyncRetryUsed = false;
    if (_lectureSyncTimer) clearTimeout(_lectureSyncTimer);
    _lectureSyncTimer = setTimeout(() => {
      _lectureSyncTimer = null;
      uploadLectureWatchToCloud();
    }, 5000);  // 5초 debounce (시청 중에는 자주 변경됨)
  }

  function flushLectureSyncIfPending() {
    const sync = loadLectureSync();
    if (!sync.pending) return;
    if (_lectureSyncInflight) return;
    if (_lectureSyncTimer) { clearTimeout(_lectureSyncTimer); _lectureSyncTimer = null; }
    _lectureSyncRetryUsed = false;
    uploadLectureWatchToCloud();
  }

  async function uploadLectureWatchToCloud() {
    if (_lectureSyncInflight) return;
    if (!studentCode) return;
    const watch = loadLectureWatch();
    if (Object.keys(watch).length === 0) return;
    const studentName = ((studentData || {}).student || {}).name || '';

    _lectureSyncInflight = true;
    _lectureSyncStatus = 'syncing';

    const payload = {
      studentCode,
      studentName,
      uploadedAt: new Date().toISOString(),
      videoCount: Object.keys(watch).length,
      videos: watch,
      daily: loadDailyLectureWatch(),  // 요일별 통계용
      deletedVideoIds: loadDeletedLectureWatchIds(),  // 통합본이 받아서 cache에서도 제거
    };
    try {
      const jsonStr = JSON.stringify(payload, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const file = new File([blob], `lecture_watch_${studentCode}_${Date.now()}.json`, { type: 'application/json' });
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('tags', `student_${studentCode},lecture_watch_submission`);
      formData.append('context', `student_code=${studentCode}|kind=lecture_watch_submission|video_count=${payload.videoCount}`);
      const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
      // keepalive: 페이지가 백그라운드/종료되어도 업로드 완료 보장 (페이로드 64KB 이내)
      const res = await fetch(url, { method: 'POST', body: formData, keepalive: true });
      const data = await res.json();
      if (!res.ok || !data.secure_url) {
        throw new Error((data.error && data.error.message) || `업로드 실패 (${res.status})`);
      }
      const cur = loadLectureSync();
      const stillDirty = cur.dirtyAt && new Date(cur.dirtyAt) > new Date(payload.uploadedAt);
      saveLectureSync({
        lastUploadedAt: payload.uploadedAt,
        lastUploadedCount: payload.videoCount,
        lastSecureUrl: data.secure_url,
        pending: !!stillDirty,
        dirtyAt: stillDirty ? cur.dirtyAt : null,
        lastError: null,
        lastErrorAt: null,
      });
      _lectureSyncStatus = stillDirty ? 'pending' : 'success';
    } catch (e) {
      console.warn('[강의영상 시청기록] 업로드 실패:', e);
      const cur = loadLectureSync();
      saveLectureSync({ ...cur, pending: true, lastError: e.message || String(e), lastErrorAt: new Date().toISOString() });
      _lectureSyncStatus = 'error';
    } finally {
      _lectureSyncInflight = false;
      if ((_lectureSyncStatus === 'error' || _lectureSyncStatus === 'pending') && !_lectureSyncRetryUsed) {
        _lectureSyncRetryUsed = true;
        if (_lectureSyncTimer) clearTimeout(_lectureSyncTimer);
        _lectureSyncTimer = setTimeout(() => { _lectureSyncTimer = null; uploadLectureWatchToCloud(); }, 30000);
      }
    }
  }

  async function fetchRankingData(force = false) {
    // 캐시 재사용 조건: 강제가 아니고, 데이터 있고, 받은지 3분 이내
    const now = Date.now();
    if (!force && _rankingData && (now - _rankingFetchedAt) < RANKING_CACHE_TTL_MS) {
      return _rankingData;
    }
    try {
      const url = `../rankings.json?t=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) {
        console.warn('[랭킹] rankings.json 받기 실패:', res.status);
        return null;
      }
      _rankingData = await res.json();
      _rankingFetchedAt = Date.now();
      return _rankingData;
    } catch (e) {
      console.warn('[랭킹] 네트워크 오류:', e);
      return null;
    }
  }

  // 수동 새로고침 (사용자가 버튼 클릭)
  window.refreshRankingData = async function() {
    if (_rankingRefreshing) return;
    _rankingRefreshing = true;
    const btn = document.getElementById('rankingRefreshBtn');
    if (btn) { btn.disabled = true; btn.classList.add('refreshing'); }
    try {
      await fetchRankingData(true);  // force
      if (typeof renderRankingContent === 'function') renderRankingContent();
    } finally {
      _rankingRefreshing = false;
      if (btn) { btn.disabled = false; btn.classList.remove('refreshing'); }
    }
  };

  // 본인의 weekSec/monthSec/totalSec/streak을 localStorage에서 직접 계산 (항상 최신)
  function computeMyOwnStats() {
    const logs = (function() {
      try { return JSON.parse(localStorage.getItem(`effortLogs__${studentCode}`) || '[]'); }
      catch(e) { return []; }
    })();
    const now = new Date();
    const dayOfWeek = (now.getDay() + 6) % 7;  // 월=0
    const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek).getTime();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    const dayMs = 86400000;

    let totalSec = 0, weekSec = 0, monthSec = 0;
    const studiedDays = new Set();
    for (const l of logs) {
      const t = l.startedAt || 0;
      const s = l.seconds || 0;
      totalSec += s;
      if (t >= weekStart) weekSec += s;
      if (t >= monthStart) monthSec += s;
      if (s > 0 && t > 0) {
        const d = new Date(t);
        studiedDays.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
      }
    }

    // 연속 일수
    let streak = 0;
    let cursor = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const todayKey = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-${String(cursor.getDate()).padStart(2,'0')}`;
    if (!studiedDays.has(todayKey)) cursor = new Date(cursor.getTime() - dayMs);
    while (true) {
      const k = `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-${String(cursor.getDate()).padStart(2,'0')}`;
      if (studiedDays.has(k)) {
        streak++;
        cursor = new Date(cursor.getTime() - dayMs);
      } else break;
    }
    return { totalSec, weekSec, monthSec, streak };
  }

  function getMyRankingEntry(key) {
    const myId = studentData?.student?.id;
    if (!myId) return null;
    const myStats = computeMyOwnStats();

    // rankings.json이 없거나 비어있으면 본인만으로 단독 리스트 생성
    let baseList = [];
    if (_rankingData && Array.isArray(_rankingData.rankings)) {
      baseList = _rankingData.rankings.slice();
    }
    // 본인 데이터를 baseList에 덮어쓰기 또는 추가
    const myIdx = baseList.findIndex(it => it.id === myId);
    if (myIdx >= 0) {
      baseList[myIdx] = { ...baseList[myIdx], ...myStats };
    } else {
      baseList.push({ id: myId, ...myStats });
    }

    // 정렬 + 순위 부여
    baseList.sort((a, b) => (b[key] || 0) - (a[key] || 0));
    let prevVal = null, prevRank = 0;
    baseList.forEach((item, i) => {
      const v = item[key] || 0;
      if (v === prevVal) item._rank = prevRank;
      else { item._rank = i + 1; prevRank = i + 1; prevVal = v; }
    });

    const entry = baseList.find(it => it.id === myId);
    if (!entry) return null;
    return { ...entry, _total: baseList.length, _list: baseList };
  }

  // 4가지 기준의 정렬된 랭킹 리스트 (랭킹 화면용 — 본인 데이터도 동적 계산 반영)
  function getRankingByKey(key) {
    const my = getMyRankingEntry(key);
    if (my) return my._list;
    if (!_rankingData || !Array.isArray(_rankingData.rankings)) return [];
    const list = _rankingData.rankings.slice();
    list.sort((a, b) => (b[key] || 0) - (a[key] || 0));
    let prevVal = null, prevRank = 0;
    list.forEach((item, i) => {
      const v = item[key] || 0;
      if (v === prevVal) item._rank = prevRank;
      else { item._rank = i + 1; prevRank = i + 1; prevVal = v; }
    });
    return list;
  }

  function fmtRankingValue(key, value) {
    if (key === 'streak') return `${value || 0}일`;
    const sec = value || 0;
    const totalMin = Math.floor(sec / 60);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m`;
  }

  function renderRankingContent() {
    const wrap = document.getElementById('rankingContentWrap');
    if (!wrap) return;
    if (!_rankingData) {
      wrap.innerHTML = `<div style="padding:40px 20px; text-align:center; color:var(--text3); font-size:13px;">랭킹 데이터를 받아오는 중...</div>`;
      return;
    }
    if (!Array.isArray(_rankingData.rankings) || _rankingData.rankings.length === 0) {
      wrap.innerHTML = `<div style="padding:40px 20px; text-align:center; color:var(--text3); font-size:13px;">아직 랭킹 데이터가 없어요.</div>`;
      return;
    }

    const tabKey = _rankingTab === 'streak' ? 'streak'
                 : _rankingTab === 'week' ? 'weekSec'
                 : _rankingTab === 'month' ? 'monthSec'
                 : 'totalSec';
    const tabLabel = _rankingTab === 'streak' ? '연속 일수'
                   : _rankingTab === 'week' ? '이번 주 공부 시간'
                   : _rankingTab === 'month' ? '이번 달 공부 시간'
                   : '전체 누적 공부 시간';

    const my = getMyRankingEntry(tabKey);
    const totalStudents = _rankingData.studentCount || 0;
    const list = my ? my._list : getRankingByKey(tabKey);

    // 상위 10명 추출
    const TOP_N = 10;
    const top = list.slice(0, TOP_N);
    const myId = studentData?.student?.id;
    const myInTop = my && my._rank <= TOP_N;

    // 마지막 갱신 시각 (상대 시간)
    let fetchedAgo = '';
    if (_rankingFetchedAt > 0) {
      const diffMs = Date.now() - _rankingFetchedAt;
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) fetchedAgo = '방금';
      else if (diffMin < 60) fetchedAgo = `${diffMin}분 전`;
      else fetchedAgo = `${Math.floor(diffMin / 60)}시간 전`;
    }

    let html = `
      <div class="ranking-summary">
        <div class="ranking-summary-top">
          <div>
            <div class="ranking-summary-head">${tabLabel}</div>
            <div class="ranking-summary-meta">전체 ${totalStudents}명 참여 중${fetchedAgo ? ` · ${fetchedAgo} 갱신` : ''}</div>
          </div>
          <button class="ranking-refresh-btn" id="rankingRefreshBtn" onclick="refreshRankingData()" title="최신 랭킹 받아오기">↻</button>
        </div>
      </div>
    `;

    // 별명 설정 카드 (펼침/접힘)
    const profile = loadRankingProfile();
    const hasNickname = !!profile.nickname;
    const isPublic = !!profile.publicNickname;
    const displayState = hasNickname && isPublic
      ? `<span style="color:oklch(50% 0.15 145); font-weight:700;">"${escapeHtml(profile.nickname)}"</span>로 공개`
      : `<span style="color:var(--text2); font-weight:600;">익명</span>으로 참여`;
    html += `
      <details class="ranking-profile-card" ${!hasNickname ? 'open' : ''}>
        <summary class="ranking-profile-summary">
          <span class="ranking-profile-current" id="rankingProfileCurrent">랭킹에 ${displayState}</span>
          <span class="ranking-profile-arrow">▾</span>
        </summary>
        <div class="ranking-profile-body">
          <label class="ranking-profile-field">
            <span class="ranking-profile-lbl">별명</span>
            <input id="rankingNicknameInput" type="text" maxlength="20" value="${escapeHtml(profile.nickname)}"
              placeholder="20자 이내" class="ranking-profile-input" oninput="updateRankingNickname()">
          </label>
          <div id="rankingNicknameWarn"></div>
          <label class="ranking-profile-toggle">
            <input id="rankingPublicToggle" type="checkbox" ${isPublic ? 'checked' : ''} onchange="updateRankingNickname()">
            <span>이 별명을 랭킹에 공개</span>
          </label>
          <div class="ranking-profile-hint">
            공개를 끄거나 별명이 비어 있으면 <b>"익명"</b>으로 표시됩니다.
          </div>
        </div>
      </details>
    `;

    // 내 순위 카드 (상단)
    if (my) {
      const myValue = fmtRankingValue(tabKey, my[tabKey]);
      html += `
        <div class="ranking-my-card">
          <div class="ranking-my-label">내 순위</div>
          <div class="ranking-my-rank">${my._rank}<span style="font-size:14px; font-weight:600;">위</span></div>
          <div class="ranking-my-value">${myValue}</div>
        </div>
      `;
    }

    // 상위 10명
    html += `<div class="ranking-top-section">`;
    html += `<div class="ranking-section-title">상위 ${Math.min(TOP_N, list.length)}명</div>`;
    html += `<div class="ranking-list">`;
    // 본인의 별명 (랭킹 설정에 저장된 값) — 본인 위치 표시용
    const myProfile = loadRankingProfile();
    const myNickname = (myProfile && myProfile.nickname) ? myProfile.nickname : '';

    for (const item of top) {
      const isMe = item.id === myId;
      const value = fmtRankingValue(tabKey, item[tabKey]);
      const valHidden = (item[tabKey] || 0) === 0;
      // 본인은 자기 별명 (공개/비공개 무관), 별명 미설정이면 "나"
      // 다른 학생은 publicNickname true + nickname 있으면 별명, 아니면 "익명"
      const displayName = isMe
        ? (myNickname || '나')
        : (item.publicNickname && item.nickname ? item.nickname : '익명');
      html += `
        <div class="ranking-row ${isMe ? 'ranking-row-me' : ''}">
          <div class="ranking-row-rank">${item._rank}</div>
          <div class="ranking-row-name">${escapeHtml(displayName)}</div>
          <div class="ranking-row-value">${valHidden ? '-' : value}</div>
        </div>
      `;
    }
    html += `</div>`;

    // 내가 TOP_N 밖이면 별도 표시
    if (my && !myInTop) {
      const value = fmtRankingValue(tabKey, my[tabKey]);
      html += `
        <div class="ranking-divider">⋯</div>
        <div class="ranking-list">
          <div class="ranking-row ranking-row-me">
            <div class="ranking-row-rank">${my._rank}</div>
            <div class="ranking-row-name">${escapeHtml(myNickname || '나')}</div>
            <div class="ranking-row-value">${value}</div>
          </div>
        </div>
      `;
    }
    html += `</div>`;

    // 응원 메시지
    if (my) {
      let msg = '';
      if (my._rank === 1) msg = '🎉 1위! 친구들에게 자랑할 만해요.';
      else if (my._rank <= 3) msg = '🏆 메달권 진입! 정상까지 얼마 남지 않았어요.';
      else if (my._rank <= TOP_N) msg = '⭐ 상위권에 있어요. 꾸준히 가요!';
      else if (my._rank <= totalStudents / 2) msg = '💪 한 단계씩 올라가 봐요.';
      else msg = '🌱 작은 시작이 큰 차이를 만들어요.';
      html += `<div class="ranking-cheer">${msg}</div>`;
    }

    wrap.innerHTML = html;
  }

  // 노력의 자취 화면 상단의 미니 "내 순위" 카드

  // ===== 노력의 자취 (타이머 + 기록) =====

  // 상단 탭 상태

  function renderEffortContent() {

  // 타이머 상태 (localStorage 영구 저장 — 화면 바뀌어도 유지)
  let _effortTimer = null;  // setInterval id
  function loadEffortState() {
    try { return JSON.parse(localStorage.getItem(`effortState__${studentCode}`) || '{}'); }
    catch(e) { return {}; }
  }
  function saveEffortState(state) {
    localStorage.setItem(`effortState__${studentCode}`, JSON.stringify(state));
  }
  function loadEffortLogs() {
    try { return JSON.parse(localStorage.getItem(`effortLogs__${studentCode}`) || '[]'); }
    catch(e) { return []; }
  }
  function saveEffortLogs(logs) {
    localStorage.setItem(`effortLogs__${studentCode}`, JSON.stringify(logs));
    rebuildSubjectColorMap(logs);  // 과목 색 매핑 동기화 (새 과목이 추가됐을 수 있음)
  }
  function loadEffortSubjects() {
    try { return JSON.parse(localStorage.getItem(`effortSubjects__${studentCode}`) || '[]'); }
    catch(e) { return []; }
  }
  function saveEffortSubjects(subjects) {
    localStorage.setItem(`effortSubjects__${studentCode}`, JSON.stringify(subjects));
  }

  // ===== 노력의 자취 — Cloudinary 자동 업로드 =====
  // 학생이 새 기록을 저장/삭제할 때마다 debounce 3초 후 전체 로그를 JSON으로 업로드.
  // tags: student_${studentCode}, effort_log_submission  (통합본에서 raw/list 로 조회)
  // 실패 시 pending 플래그를 localStorage 에 남겨두고 화면 진입 시 자동 재시도.
  let _effortSyncTimer = null;
  let _effortSyncStatus = 'idle';  // 'idle' | 'syncing' | 'success' | 'pending' | 'error'
  let _effortSyncInflight = false;
  let _effortSyncRetryUsed = false;  // 자동 재시도 1회만 (학생 액션이 있을 때 리셋)

  function loadEffortSync() {
    try { return JSON.parse(localStorage.getItem(`effortSync__${studentCode}`) || '{}'); }
    catch(e) { return {}; }
  }
  function saveEffortSync(s) {
    try { localStorage.setItem(`effortSync__${studentCode}`, JSON.stringify(s)); } catch(e) {}
  }

  // 변경 발생 → debounce 후 업로드 (immediate=true면 즉시 시작)
  function markEffortLogsDirty(opts) {
    const immediate = !!(opts && opts.immediate);
    const sync = loadEffortSync();
    saveEffortSync({ ...sync, pending: true, dirtyAt: new Date().toISOString() });
    _effortSyncStatus = 'pending';
    _effortSyncRetryUsed = false;  // 새 변경이 있으니 자동 재시도 다시 허용
    renderEffortSyncIndicator();
    if (_effortSyncTimer) { clearTimeout(_effortSyncTimer); _effortSyncTimer = null; }
    if (immediate) {
      // 학생이 명시적으로 저장한 액션 — 즉시 업로드 시작
      uploadEffortLogsToCloud();
    } else {
      // 자동 변경(보정 등) — 1초 debounce
      _effortSyncTimer = setTimeout(() => {
        _effortSyncTimer = null;
        uploadEffortLogsToCloud();
      }, 1000);
    }
  }

  // 즉시 업로드 트리거 (강제) — 화면 진입 시·수동 재시도 클릭 시
  function flushEffortSyncIfPending() {
    const sync = loadEffortSync();
    if (!sync.pending) return;
    if (_effortSyncInflight) return;
    if (_effortSyncTimer) { clearTimeout(_effortSyncTimer); _effortSyncTimer = null; }
    _effortSyncRetryUsed = false;  // 수동 트리거이므로 자동 재시도 1회 재허용
    uploadEffortLogsToCloud();
  }

  async function uploadEffortLogsToCloud() {
    if (_effortSyncInflight) return;
    if (!studentCode) return;
    const logs = loadEffortLogs();
    const studentName = ((studentData || {}).student || {}).name || '';

    _effortSyncInflight = true;
    _effortSyncStatus = 'syncing';
    renderEffortSyncIndicator();

    const snapshotCount = logs.length;
    const rankingProfile = loadRankingProfile();
    const payload = {
      studentCode,
      studentName,
      uploadedAt: new Date().toISOString(),
      logCount: snapshotCount,
      logs,
      deletedIds: loadDeletedEffortLogIds(),  // 통합본이 받아서 cache에서도 제거
      nickname: rankingProfile.nickname,
      publicNickname: rankingProfile.publicNickname,
    };

    try {
      const jsonStr = JSON.stringify(payload, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const file = new File([blob], `effort_log_${studentCode}_${Date.now()}.json`, { type: 'application/json' });
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('tags', `student_${studentCode},effort_log_submission`);
      formData.append('context', `student_code=${studentCode}|kind=effort_log_submission|log_count=${snapshotCount}`);
      const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;
      // keepalive: 페이지가 백그라운드/종료되어도 업로드 완료 보장
      const res = await fetch(url, { method: 'POST', body: formData, keepalive: true });
      const data = await res.json();
      if (!res.ok || !data.secure_url) {
        throw new Error((data.error && data.error.message) || `업로드 실패 (${res.status})`);
      }

      // 업로드 중 새 변경이 들어왔으면 pending 유지 (다음 debounce 트리거가 처리)
      const cur = loadEffortSync();
      const stillDirty = cur.dirtyAt && new Date(cur.dirtyAt) > new Date(payload.uploadedAt);
      saveEffortSync({
        lastUploadedAt: payload.uploadedAt,
        lastUploadedCount: snapshotCount,
        lastSecureUrl: data.secure_url,
        pending: !!stillDirty,
        dirtyAt: stillDirty ? cur.dirtyAt : null,
        lastError: null,
        lastErrorAt: null,
      });
      _effortSyncStatus = stillDirty ? 'pending' : 'success';
    } catch (e) {
      console.warn('[노력의자취] 자동 업로드 실패:', e);
      const cur = loadEffortSync();
      saveEffortSync({
        ...cur,
        pending: true,
        lastError: e.message || String(e),
        lastErrorAt: new Date().toISOString(),
      });
      _effortSyncStatus = 'error';
    } finally {
      _effortSyncInflight = false;
      renderEffortSyncIndicator();
      // pending/error 상태면 30초 후 1회만 자동 재시도 (학생이 페이지 머무는 동안 일시적 네트워크 복구 대비)
      if ((_effortSyncStatus === 'error' || _effortSyncStatus === 'pending') && !_effortSyncRetryUsed) {
        _effortSyncRetryUsed = true;
        if (_effortSyncTimer) clearTimeout(_effortSyncTimer);
        _effortSyncTimer = setTimeout(() => {
          _effortSyncTimer = null;
          uploadEffortLogsToCloud();
        }, 30000);
      }
    }
  }

  function renderEffortSyncIndicator() {
    const el = document.getElementById('effortSyncIndicator');
    if (!el) return;
    const sync = loadEffortSync();
    const logs = loadEffortLogs();

    // 아직 한 번도 업로드한 적이 없고 기록도 없으면 표시 안 함
    if (!sync.lastUploadedAt && logs.length === 0 && _effortSyncStatus === 'idle') {
      el.outerHTML = `<span id="effortSyncIndicator"></span>`; return;
    }

    let cls, label;
    if (_effortSyncStatus === 'syncing') {
      cls = 'syncing'; label = '저장 중…';
    } else if (_effortSyncStatus === 'error') {
      cls = 'error'; label = '저장 보류 · 다시 시도';
    } else if (_effortSyncStatus === 'pending' || sync.pending) {
      cls = 'pending'; label = '대기 중…';
    } else if (sync.lastUploadedAt) {
      const t = new Date(sync.lastUploadedAt);
      const today = new Date();
      const sameDay = t.toDateString() === today.toDateString();
      const hm = `${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;
      label = sameDay
        ? `자동 저장됨 · ${hm}`
        : `자동 저장됨 · ${t.getMonth()+1}/${t.getDate()} ${hm}`;
      cls = 'success';
    } else {
      el.outerHTML = `<span id="effortSyncIndicator"></span>`; return;
    }

    const onclick = cls === 'error' ? ' onclick="flushEffortSyncIfPending()" title="다시 시도하기"' : '';
    el.outerHTML = `<span id="effortSyncIndicator" class="effort-sync-indicator ${cls}"${onclick}><span class="effort-sync-dot"></span>${escapeHtml(label)}</span>`;
  }

  // 외부에서 호출 가능 (수동 재시도용)
  window.flushEffortSyncIfPending = flushEffortSyncIfPending;

  function initEffortScreen() {
    rebuildSubjectColorMap(loadEffortLogs());
    renderEffortContent();
    renderEffortSyncIndicator();
    // 화면 진입 시 미동기화 로그가 있으면 자동으로 재시도
    flushEffortSyncIfPending();
    // 랭킹 미니 카드 비동기 로드
    loadAndShowRankingMiniCard();
    if (_effortTimer) clearInterval(_effortTimer);
    _effortTimer = setInterval(() => {
      if (_effortTab !== 'today') return;
      const s = loadEffortState();
      if (s.status === 'running') renderEffortTimer();
    }, 1000);
  }

  // 측정된 총 초 계산
  function getElapsedSeconds(state) {
    if (!state || !state.startedAt) return 0;
    let acc = state.accumulatedMs || 0;
    if (state.status === 'running' && state.runningSince) {
      acc += Date.now() - state.runningSince;
    }
    return Math.floor(acc / 1000);
  }

  function fmtDuration(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}시간 ${m}분 ${s.toString().padStart(2,'0')}초`;
    if (m > 0) return `${m}분 ${s.toString().padStart(2,'0')}초`;
    return `${s}초`;
  }
  function fmtDurationShort(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h > 0) return `${h}시간 ${m}분`;
    return `${m}분`;
  }

  // 시간 막대 헤더용 짧은 형식 (예: "1h 50m")
  function fmtDurationCompact(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h > 0 && m > 0) return `${h}h ${m}m`;
    if (h > 0) return `${h}h`;
    return `${m}m`;
  }

  // 12시간제 (예: "11:30 AM", "1:20 PM")
  function fmtTime12(date) {
    const h = date.getHours();
    const m = date.getMinutes();
    const ampm = h < 12 ? 'AM' : 'PM';
    const h12 = h === 0 ? 12 : (h > 12 ? h - 12 : h);
    return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
  }

  // 시간 범위 12시간제 (시작/끝 AM/PM 같으면 끝에만 표시)
  // 예: "10:30 – 11:50 AM", "11:30 AM – 1:20 PM"
  function fmtTimeRange12(start, end) {
    const sh = start.getHours(), sm = start.getMinutes();
    const eh = end.getHours(),   em = end.getMinutes();
    const sAmPm = sh < 12 ? 'AM' : 'PM';
    const eAmPm = eh < 12 ? 'AM' : 'PM';
    const sH12 = sh === 0 ? 12 : (sh > 12 ? sh - 12 : sh);
    const eH12 = eh === 0 ? 12 : (eh > 12 ? eh - 12 : eh);
    const sBase = `${sH12}:${String(sm).padStart(2,'0')}`;
    const eBase = `${eH12}:${String(em).padStart(2,'0')}`;
    return sAmPm === eAmPm
      ? `${sBase} – ${eBase} ${eAmPm}`
      : `${sBase} ${sAmPm} – ${eBase} ${eAmPm}`;
  }

  function renderEffortTimer() {
    const wrap = document.getElementById('effortTimerSection');
    if (!wrap) return;
    const state = loadEffortState();
    const elapsed = getElapsedSeconds(state);
    const status = state.status || 'idle';

    let buttons = '';
    if (status === 'idle') {
      buttons = `<button class="effort-btn effort-btn-primary" onclick="startEffortTimer()">▶ 시작</button>`;
    } else if (status === 'running') {
      buttons = `
        <button class="effort-btn effort-btn-secondary" onclick="pauseEffortTimer()">⏸ 일시정지</button>
        <button class="effort-btn effort-btn-primary" onclick="endEffortTimer()">⏹ 종료</button>
      `;
    } else if (status === 'paused') {
      buttons = `
        <button class="effort-btn effort-btn-primary" onclick="resumeEffortTimer()">▶ 이어서</button>
        <button class="effort-btn effort-btn-secondary" onclick="endEffortTimer()">⏹ 종료</button>
      `;
    }

    const statusLabel = status === 'running' ? '<span style="color:#2e7d32;">● 측정 중</span>'
      : status === 'paused' ? '<span style="color:#8b6914;">⏸ 일시정지</span>'
      : '<span style="color:var(--text3);">대기</span>';

    wrap.innerHTML = `
      <div class="effort-timer-card">
        <div class="effort-timer-status">${statusLabel}</div>
        <div class="effort-timer-display ${status}">${fmtDuration(elapsed)}</div>
        <div class="effort-timer-buttons">${buttons}</div>
        ${status !== 'idle' ? `<button class="effort-cancel-btn" onclick="cancelEffortTimer()">취소</button>` : ''}
      </div>
    `;
  }

  window.startEffortTimer = function() {
    const now = Date.now();
    saveEffortState({ status: 'running', startedAt: now, runningSince: now, accumulatedMs: 0 });
    renderEffortTimer();
  };
  window.pauseEffortTimer = function() {
    const s = loadEffortState();
    if (s.status !== 'running') return;
    const acc = (s.accumulatedMs || 0) + (Date.now() - s.runningSince);
    saveEffortState({ ...s, status: 'paused', accumulatedMs: acc, runningSince: null });
    renderEffortTimer();
  };
  window.resumeEffortTimer = function() {
    const s = loadEffortState();
    if (s.status !== 'paused') return;
    saveEffortState({ ...s, status: 'running', runningSince: Date.now() });
    renderEffortTimer();
  };
  window.cancelEffortTimer = function() {
    if (!confirm('타이머를 취소할까요? 측정한 시간이 기록되지 않습니다.')) return;
    localStorage.removeItem(`effortState__${studentCode}`);
    renderEffortTimer();
  };
  window.endEffortTimer = function() {
    const s = loadEffortState();
    if (!s.startedAt) return;
    let acc = s.accumulatedMs || 0;
    if (s.status === 'running' && s.runningSince) acc += Date.now() - s.runningSince;
    const sec = Math.floor(acc / 1000);
    if (sec < 30) {
      if (!confirm('측정한 시간이 30초 미만이에요. 그래도 기록할까요?')) return;
    }
    showEffortSaveModal(sec, s.startedAt);
  };

  function showEffortSaveModal(seconds, startedAt) {
    const subjects = loadEffortSubjects();
    // 기본 과목 + 최근 사용 과목 (중복 제거, 최대 8개)
    const defaults = ['수학', '영어', '국어', '과학', '사회'];
    const merged = [];
    const seen = new Set();
    for (const s of subjects.concat(defaults)) {
      if (!s || seen.has(s)) continue;
      seen.add(s);
      merged.push(s);
      if (merged.length >= 8) break;
    }
    let backdrop = document.getElementById('effortSaveModal');
    if (!backdrop) {
      backdrop = document.createElement('div');
      backdrop.id = 'effortSaveModal';
      backdrop.className = 'effort-modal-backdrop';
      document.body.appendChild(backdrop);
    }
    backdrop.innerHTML = `
      <div class="effort-modal">
        <div class="effort-modal-head">
          <div class="effort-modal-title">공부 기록 남기기</div>
          <div class="effort-modal-time">${fmtDuration(seconds)}</div>
        </div>
        <div class="effort-modal-body">
          <div>
            <label class="gi-label">과목</label>
            <input type="text" class="gi-input" id="effortSubject" list="effortSubjectList" placeholder="예: 수학, 영어, 국어">

              ${subjects.map(s => `<option value="${escapeHtml(s)}"></option>`).join('')}
            </datalist>
            <div class="effort-subject-chips">
              ${merged.map((s, i) => {
                const isRecent = subjects.includes(s);
                return `<button type="button" class="effort-chip${isRecent ? ' recent' : ''}" onclick="document.getElementById('effortSubject').value=this.textContent;">${escapeHtml(s)}</button>`;
              }).join('')}
            </div>
          </div>
          <div style="margin-top:10px;">
            <label class="gi-label">공부 방식</label>
            <select class="gi-input" id="effortMethod">
              <option value="문제 풀이">문제 풀이</option>
              <option value="강의 시청">강의 시청</option>
              <option value="개념 정리">개념 정리</option>
              <option value="오답 정리">오답 정리</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div style="margin-top:10px;">
            <label class="gi-label">공부 내용 *</label>
            <input type="text" class="gi-input" id="effortContent" placeholder="예: 쎈 3단원 응용문제 18~32번">
          </div>
          <div style="margin-top:10px;">
            <label class="gi-label">느낀점 · 반성 (선택)</label>
            <textarea class="gi-input" id="effortReflection" rows="2" placeholder="예: 23번 어려웠음. 다시 풀어볼 것"></textarea>
          </div>
        </div>
        <div class="effort-modal-foot">
          <button class="effort-btn effort-btn-secondary" onclick="closeEffortSaveModal()">취소</button>
          <button class="effort-btn effort-btn-primary" onclick="saveEffortLog(${seconds}, ${startedAt})">저장</button>
        </div>
      </div>
    `;
    backdrop.classList.add('active');
    setTimeout(() => document.getElementById('effortSubject')?.focus(), 100);
  }

  window.closeEffortSaveModal = function() {
    const el = document.getElementById('effortSaveModal');
    if (el) el.classList.remove('active');
  };

  window.saveEffortLog = function(seconds, startedAt) {
    const subject = (document.getElementById('effortSubject')?.value || '').trim();
    const method = document.getElementById('effortMethod')?.value || '';
    const content = (document.getElementById('effortContent')?.value || '').trim();
    const reflection = (document.getElementById('effortReflection')?.value || '').trim();
    if (!subject) { alert('과목을 입력해주세요.'); return; }
    if (!content) { alert('공부 내용을 입력해주세요.'); return; }

    // 과목 자동완성 누적
    const subjects = loadEffortSubjects();
    if (!subjects.includes(subject)) {
      subjects.unshift(subject);
      saveEffortSubjects(subjects.slice(0, 20));  // 최근 20개만
    }

    // startedAt 자동 보정: 측정된 시간(seconds)에 비해 startedAt~endedAt 간격이 비정상적으로 크면
    // (예: 학생이 타이머 켜놓고 며칠 후 저장)
    // → 실제 학습 끝난 시점(endedAt)에서 측정된 시간만큼 거꾸로 계산
    const endedAt = Date.now();
    const measuredMs = (seconds || 0) * 1000;
    const elapsedMs = endedAt - (startedAt || 0);
    const TOLERANCE_MS = 12 * 60 * 60 * 1000;  // 12시간 — 그 이상 차이면 보정
    let finalStartedAt = startedAt;
    if (elapsedMs > measuredMs + TOLERANCE_MS) {
      finalStartedAt = endedAt - measuredMs;
      console.log('[학습기록] startedAt 보정:', new Date(startedAt).toLocaleString(), '→', new Date(finalStartedAt).toLocaleString());
    }

    const logs = loadEffortLogs();
    logs.push({
      id: 'effort_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      startedAt: finalStartedAt,
      endedAt,
      seconds: seconds,
      subject, method, content, reflection,
      sharedWithParent: false,
      createdAt: new Date().toISOString(),
    });
    saveEffortLogs(logs);

    // 타이머 초기화
    localStorage.removeItem(`effortState__${studentCode}`);
    closeEffortSaveModal();
    renderEffortContent();
    // Cloudinary 즉시 업로드 (사용자 명시적 저장)
    markEffortLogsDirty({ immediate: true });
    renderEffortSyncIndicator();
  };

  function renderEffortToday() {
    const wrap = document.getElementById('effortTodaySection');
    if (!wrap) return;
    const logs = loadEffortLogs();
    const today = new Date();
    const todayStr = today.toISOString().slice(0, 10);
    const todayLogs = logs.filter(l => new Date(l.startedAt).toISOString().slice(0,10) === todayStr);
    const totalSec = todayLogs.reduce((a, l) => a + l.seconds, 0);

    // 과목별 합계
    const bySubject = {};
    todayLogs.forEach(l => {
      bySubject[l.subject] = (bySubject[l.subject] || 0) + l.seconds;
    });
    const sorted = Object.entries(bySubject).sort((a,b) => b[1] - a[1]);

    let html = `
      <div class="effort-today-card">
        <div class="effort-today-label">오늘의 공부</div>
        <div class="effort-today-total">${fmtDurationShort(totalSec)}</div>
    `;
    if (sorted.length > 0) {
      html += `<div class="effort-today-subjects">`;
      sorted.forEach(([subj, sec]) => {
        const pct = totalSec > 0 ? Math.round(sec / totalSec * 100) : 0;
        html += `
          <div class="effort-today-subj">
            <div class="effort-today-subj-head">
              <span class="effort-today-subj-name">${escapeHtml(subj)}</span>
              <span class="effort-today-subj-time">${fmtDurationShort(sec)} (${pct}%)</span>
            </div>
            <div class="effort-today-subj-bar"><div style="width:${pct}%;"></div></div>
          </div>
        `;
      });
      html += `</div>`;
    } else {
      html += `<div style="font-size:12px; color:var(--text3); margin-top:8px;">아직 오늘 기록이 없어요.</div>`;
    }
    html += `</div>`;
    wrap.innerHTML = html;
  }

  // 연속 일수 계산
  function calcStreak(logs) {
    if (logs.length === 0) return 0;
    const days = new Set(logs.map(l => new Date(l.startedAt).toISOString().slice(0,10)));
    let streak = 0;
    const today = new Date();
    today.setHours(0,0,0,0);
    let cur = new Date(today);
    while (true) {
      const ds = cur.toISOString().slice(0,10);
      if (days.has(ds)) {
        streak++;
        cur.setDate(cur.getDate() - 1);
      } else {
        // 오늘 안 했어도 어제까지 연속이면 streak 유지 (아직 오늘이 안 끝남)
        if (streak === 0 && ds === today.toISOString().slice(0,10)) {
          cur.setDate(cur.getDate() - 1);
          continue;
        }
        break;
      }
    }
    return streak;
  }

  function renderEffortStreak() {
    const wrap = document.getElementById('effortStreakSection');
    if (!wrap) return;
    const logs = loadEffortLogs();
    if (logs.length === 0) { wrap.innerHTML = ''; return; }
    const streak = calcStreak(logs);
    if (streak === 0) { wrap.innerHTML = ''; return; }
    const msg = streak >= 7 ? '대단해요! 꾸준함이 자산이에요 ✨'
      : streak >= 3 ? '꾸준히 잘하고 있어요!'
      : '시작이 반이에요. 내일도 화이팅!';
    wrap.innerHTML = `
      <div class="effort-streak-card">
        <div class="effort-streak-num">${streak}일 연속</div>
        <div class="effort-streak-msg">${msg}</div>
      </div>
    `;
  }

  function renderEffortStats() {
    const wrap = document.getElementById('effortStatsSection');
    if (!wrap) return;
    const logs = loadEffortLogs();
    if (logs.length === 0) { wrap.innerHTML = `<div style="font-size:12.5px; color:var(--text3); text-align:center; padding:20px 0;">아직 공부 기록이 없어요.<br>"오늘의 공부"에서 첫 기록을 남겨주세요.</div>`; return; }

    let html = '';

  // 캘린더 선택 날짜
  let _effortCalSelectedDay = null;  // {year, month, day} or null
  window.toggleEffortCalDay = function(year, month, day) {
    if (_effortCalSelectedDay
      && _effortCalSelectedDay.year === year
      && _effortCalSelectedDay.month === month
      && _effortCalSelectedDay.day === day) {
      _effortCalSelectedDay = null;
    } else {
      _effortCalSelectedDay = { year, month, day };
    }
    renderEffortStats();
  };

  let _monthViewDate = new Date();  // 현재 보고 있는 달 (기본 이번 달)
  window.shiftMonthView = function(delta) {
    const target = new Date(_monthViewDate.getFullYear(), _monthViewDate.getMonth() + delta, 1);
    const now = new Date();
    const thisMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    // 미래 달로는 못 감
    if (target > thisMonthEnd) return;
    _monthViewDate = target;
    _effortCalSelectedDay = null;  // 월 바뀌면 선택 초기화
    renderEffortContent();
  };
  window.resetMonthView = function() {
    _monthViewDate = new Date();
    _effortCalSelectedDay = null;
    renderEffortContent();
  };

  function renderEffortMonthStats(logs) {
    const today = new Date();
    const year = _monthViewDate.getFullYear();
    const month = _monthViewDate.getMonth();
    const isThisMonth = year === today.getFullYear() && month === today.getMonth();
    const monthStart = new Date(year, month, 1);
    const monthEnd = new Date(year, month + 1, 0);
    const daysInMonth = monthEnd.getDate();
    const firstDayOfWeek = (monthStart.getDay() + 6) % 7;  // 월=0

    const monthLogs = logs.filter(l => {
      const d = new Date(l.startedAt);
      return d.getFullYear() === year && d.getMonth() === month;
    });
    const totalSec = monthLogs.reduce((a,l) => a + l.seconds, 0);

    const dayMap = {};
    monthLogs.forEach(l => {
      const d = new Date(l.startedAt);
      const day = d.getDate();
      dayMap[day] = (dayMap[day] || 0) + l.seconds;
    });
    const maxSec = Math.max(...Object.values(dayMap), 1);

    const bySubject = {};
    monthLogs.forEach(l => {
      bySubject[l.subject] = (bySubject[l.subject] || 0) + l.seconds;
    });

    let html = `<div class="effort-stats-content">`;
    // 월 이동 내비게이션
    html += `<div class="month-nav">
      <button class="month-nav-btn" onclick="shiftMonthView(-1)" title="이전 달">‹</button>
      <span class="month-nav-label">${year}년 ${month+1}월</span>
      <button class="month-nav-btn" onclick="shiftMonthView(1)" title="다음 달" ${isThisMonth ? 'disabled' : ''}>›</button>
      ${!isThisMonth ? `<button class="month-nav-reset" onclick="resetMonthView()">이번 달로</button>` : ''}
    </div>`;
    html += `<div class="effort-stats-total"><span class="lbl">${month+1}월 총</span> <span class="val">${fmtDurationShort(totalSec)}</span></div>`;
    html += `<div class="effort-stats-hint">날짜를 클릭하면 그날의 학습 기록이 상세히 보입니다.</div>`;

    // 캘린더 그리드
    html += `<div class="effort-cal-wrap">`;
    html += `<div class="effort-cal-head">`;
    ['월','화','수','목','금','토','일'].forEach(d => html += `<div class="effort-cal-head-cell">${d}</div>`);
    html += `</div>`;
    html += `<div class="effort-cal-grid">`;
    for (let i = 0; i < firstDayOfWeek; i++) html += `<div class="effort-cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const sec = dayMap[d] || 0;
      const intensity = sec > 0 ? Math.min(1, sec / Math.max(maxSec, 3600)) : 0;
      const isToday = isThisMonth && today.getDate() === d;
      const isSelected = _effortCalSelectedDay && _effortCalSelectedDay.year === year
        && _effortCalSelectedDay.month === month && _effortCalSelectedDay.day === d;
      const totalMin = Math.floor(sec / 60);
      const hours = Math.floor(totalMin / 60);
      const mins = totalMin % 60;
      const timeText = totalMin > 0 ? `${hours}시간 ${mins}분` : '';
      const tooltip = sec > 0 ? `${d}일: ${fmtDurationShort(sec)}` : `${d}일`;
      // 농도: lightness 92% → 50%, chroma 0.06 → 0.20 (공부량 0 → 최대)
      let bgStyle;
      if (sec === 0) {
        bgStyle = '';  // 빈 날 — surface2 기본색
      } else {
        const L = 92 - intensity * 42;
        const C = 0.06 + intensity * 0.14;
        bgStyle = `background:oklch(${L}% ${C} 125);`;
      }
      html += `<div class="effort-cal-cell ${sec > 0 ? 'studied' : ''} ${isToday?'today':''} ${isSelected?'selected':''}" style="${bgStyle}" title="${tooltip}" onclick="toggleEffortCalDay(${year}, ${month}, ${d})">
        <div class="effort-cal-day">${d}</div>
        ${timeText ? `<div class="effort-cal-mins">${timeText}</div>` : ''}
      </div>`;
    }
    html += `</div></div>`;

    // 원그래프
    if (Object.keys(bySubject).length > 0) {
      html += renderEffortPieChart(bySubject, totalSec);
    }
    // 선택된 날짜의 기록
    if (_effortCalSelectedDay) {
      html += renderEffortDayDetail(logs);
    }
    html += `</div>`;
    return html;
  }

  function renderEffortWeekStats(logs) {
    const today = new Date();
    const dayOfWeek = (today.getDay() + 6) % 7;
    const monday = new Date(today);
    monday.setDate(today.getDate() - dayOfWeek);
    monday.setHours(0,0,0,0);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 7);

    const weekLogs = logs.filter(l => {
      const d = new Date(l.startedAt);
      return d >= monday && d < sunday;
    });
    const totalSec = weekLogs.reduce((a,l) => a + l.seconds, 0);

    const dayTotals = [0,0,0,0,0,0,0];
    weekLogs.forEach(l => {
      const d = new Date(l.startedAt);
      const idx = (d.getDay() + 6) % 7;
      dayTotals[idx] += l.seconds;
    });
    const maxSec = Math.max(...dayTotals, 1);

    const bySubject = {};
    weekLogs.forEach(l => {
      bySubject[l.subject] = (bySubject[l.subject] || 0) + l.seconds;
    });

    let html = `<div class="effort-stats-content">`;
    html += `<div class="effort-stats-total"><span class="lbl">이번 주 총</span> <span class="val">${fmtDurationShort(totalSec)}</span></div>`;
    html += `<div class="effort-stats-hint">날짜를 클릭하면 그날의 학습 기록이 상세히 보입니다.</div>`;

    // 일별 막대 (클릭 가능)
    html += `<div class="effort-day-bars">`;
    const dayNames = ['월','화','수','목','금','토','일'];
    const todayIdx = (today.getDay() + 6) % 7;
    dayTotals.forEach((sec, i) => {
      const h = maxSec > 0 ? (sec / maxSec * 100) : 0;
      const isToday = i === todayIdx;
      const date = new Date(monday);
      date.setDate(monday.getDate() + i);
      const dateStr = `${date.getDate()}`;
      const yr = date.getFullYear(), mo = date.getMonth(), dy = date.getDate();
      const isSelected = _effortCalSelectedDay
        && _effortCalSelectedDay.year === yr
        && _effortCalSelectedDay.month === mo
        && _effortCalSelectedDay.day === dy;
      html += `
        <div class="effort-day-bar-col ${isSelected?'selected':''}" onclick="toggleEffortCalDay(${yr}, ${mo}, ${dy})">
          <div class="effort-day-bar-val">${sec > 0 ? fmtDurationShort(sec) : ''}</div>
          <div class="effort-day-bar"><div class="effort-day-bar-fill ${isToday?'today':''}" style="height:${h}%;"></div></div>
          <div class="effort-day-bar-label ${isToday?'today':''}">${dayNames[i]}<br><span style="font-size:9px; color:var(--text3);">${dateStr}</span></div>
        </div>
      `;
    });
    html += `</div>`;

    if (Object.keys(bySubject).length > 0) {
      html += renderEffortPieChart(bySubject, totalSec);
    }
    if (_effortCalSelectedDay) {
      html += renderEffortDayDetail(logs);
    }
    html += `</div>`;
    return html;
  }

  // 선택된 날짜의 공부 기록
  function renderEffortDayDetail(logs) {
    const d = _effortCalSelectedDay;
    if (!d) return '';
    const targetLogs = logs.filter(l => {
      const ld = new Date(l.startedAt);
      return ld.getFullYear() === d.year && ld.getMonth() === d.month && ld.getDate() === d.day;
    }).sort((a,b) => a.startedAt - b.startedAt);
    const totalSec = targetLogs.reduce((a,l) => a + l.seconds, 0);

    let html = `
      <div class="effort-day-detail">
        <div class="effort-day-detail-head">
          <span class="effort-day-detail-date">${d.month+1}월 ${d.day}일</span>
          <span class="effort-day-detail-total">${totalSec > 0 ? fmtDurationShort(totalSec) : '기록 없음'}</span>
          <button class="effort-day-detail-close" onclick="toggleEffortCalDay(${d.year},${d.month},${d.day})">×</button>
        </div>
    `;
    if (targetLogs.length === 0) {
      html += `<div style="font-size:12px; color:var(--text3); padding:10px 4px;">이 날에는 공부 기록이 없어요.</div>`;
    } else {
      // 24시간 타임라인 시각화
      html += renderEffortDayTimeline(targetLogs, d);
    }
    html += `</div>`;
    return html;
  }

  // 24시간 타임라인 시각화 (선택한 날 하루)
  // 학습 있는 시간대는 확대(50px/시간), 없는 시간대는 압축(12px/시간)
  function renderEffortDayTimeline(targetLogs, d) {
    // 라임 톤 팔레트 (과목별로 일관된 색)
    const subjOrder = [];
    for (const l of targetLogs) {
      if (!subjOrder.includes(l.subject)) subjOrder.push(l.subject);
    }
    const colorOf = (subj) => getSubjectColor(subj);

    // (1) 학습 활성 구간 계산 — 각 학습 ±30분 버퍼, 인접 구간 병합
    const BUFFER_HR = 0.5;
    const ranges = targetLogs.map(l => {
      const start = new Date(l.startedAt);
      const startHr = start.getHours() + start.getMinutes()/60 + start.getSeconds()/3600;
      const endHr = startHr + (l.seconds || 0) / 3600;
      return [Math.max(0, startHr - BUFFER_HR), Math.min(24, endHr + BUFFER_HR)];
    }).sort((a, b) => a[0] - b[0]);

    const merged = [];
    for (const r of ranges) {
      if (merged.length === 0 || merged[merged.length-1][1] < r[0]) {
        merged.push([r[0], r[1]]);
      } else {
        merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], r[1]);
      }
    }

    // (2) 0~24시간을 활성/비활성 segment로 분할
    const ACTIVE_PX = 50;     // 활성 시간 1시간 = 50px (확대)
    const INACTIVE_PX = 12;   // 비활성 시간 1시간 = 12px (압축)
    const segments = [];
    let cursor = 0;
    for (const [s, e] of merged) {
      if (cursor < s) segments.push({ s: cursor, e: s, active: false });
      segments.push({ s, e, active: true });
      cursor = e;
    }
    if (cursor < 24) segments.push({ s: cursor, e: 24, active: false });

    // (3) 각 segment 픽셀 위치
    let cumPx = 0;
    for (const seg of segments) {
      seg.startPx = cumPx;
      seg.pxPerHour = seg.active ? ACTIVE_PX : INACTIVE_PX;
      seg.height = (seg.e - seg.s) * seg.pxPerHour;
      cumPx += seg.height;
    }
    const TOTAL_HEIGHT = cumPx;

    // (4) 시간 → 픽셀 매핑 함수
    function hourToPx(hr) {
      for (const seg of segments) {
        if (hr >= seg.s && hr <= seg.e) {
          const ratio = seg.e === seg.s ? 0 : (hr - seg.s) / (seg.e - seg.s);
          return seg.startPx + ratio * seg.height;
        }
      }
      return cumPx;
    }

    // (5) 시간 라벨 (12AM 제외, 1AM~11PM)
    // 비활성 시간대는 라벨이 겹치지 않도록 자동 스킵
    // 가로 구분선은 events 영역에 별도로 그림 (라벨 영역과 겹치지 않게)
    let hoursHtml = '';
    let gridLinesHtml = '';
    let lastShownPx = -100;
    for (let h = 1; h < 24; h++) {
      const top = hourToPx(h);
      const inActive = merged.some(([s, e]) => h >= s && h <= e);
      // 활성 구간 안이면 항상 표시, 비활성이면 마지막 라벨과 거리 체크
      if (!inActive && top - lastShownPx < 18) continue;

      let label;
      if (h === 12) label = '12 PM';
      else if (h < 12) label = `${h} AM`;
      else label = `${h - 12} PM`;

      hoursHtml += `
        <div class="day-tl-row ${inActive ? 'active' : ''}" style="top:${top}px;">
          <div class="day-tl-label">${label}</div>
        </div>
      `;
      gridLinesHtml += `<div class="day-tl-gridline" style="top:${top}px;"></div>`;
      lastShownPx = top;
    }

    // (6) 활성/비활성 segment 배경 표시 (비활성은 회색 톤으로 구분)
    let bgHtml = '';
    for (const seg of segments) {
      if (!seg.active) {
        bgHtml += `<div class="day-tl-bg-inactive" style="top:${seg.startPx}px; height:${seg.height}px;"></div>`;
      }
    }

    // (7) 학습 이벤트 막대
    let eventsHtml = '';
    for (const l of targetLogs) {
      const start = new Date(l.startedAt);
      const startHr = start.getHours() + start.getMinutes()/60 + start.getSeconds()/3600;
      const endHr = startHr + (l.seconds || 0) / 3600;
      const top = hourToPx(startHr);
      const height = Math.max(hourToPx(endHr) - top, 30);
      const color = colorOf(l.subject);

      const endTime = new Date(start.getTime() + l.seconds * 1000);
      const durationStr = fmtDurationShort(l.seconds);  // "1시간 30분"
      const timeRangeStr = fmtTimeRange12(start, endTime);  // AM/PM 같으면 끝에만

      eventsHtml += `
        <div class="day-tl-event" style="top:${top}px; height:${height}px; background:${color};">
          <div class="day-tl-event-inner">
            <div class="day-tl-event-title">
              <span class="day-tl-event-subj">${escapeHtml(l.subject)}</span>
              <span class="day-tl-event-time">${durationStr} (${timeRangeStr})</span>
            </div>
            ${l.content ? `<div class="day-tl-event-content">${escapeHtml(l.content)}</div>` : ''}
            ${l.reflection ? `<div class="day-tl-event-refl">📔 ${escapeHtml(l.reflection)}</div>` : ''}
          </div>
        </div>
      `;
    }

    return `
      <div class="day-tl-wrap" style="height:${TOTAL_HEIGHT}px;">
        <div class="day-tl-hours">${hoursHtml}</div>
        <div class="day-tl-events">${gridLinesHtml}${bgHtml}${eventsHtml}</div>
      </div>
    `;
  }

  // 원그래프 + 범례 (과목별 고정 색)
  function renderEffortPieChart(bySubject, totalSec) {
    const sorted = Object.entries(bySubject).filter(([s, sec]) => sec > 0).sort((a,b) => b[1] - a[1]);
    if (sorted.length === 0) return '';

    const size = 300;
    let svgContent = '';
    let viewBox = `0 0 ${size} ${size}`;
    let displayH = size;

    // d3-hierarchy의 pack()으로 버블 위치/크기 자동 계산
    if (typeof d3 !== 'undefined' && d3.hierarchy && d3.pack) {
      const data = { children: sorted.map(([subject, seconds]) => ({ subject, seconds })) };
      const root = d3.hierarchy(data).sum(d => d.seconds);
      d3.pack().size([size, size]).padding(3)(root);
      const nodes = root.children || [];

      // 실제 원들의 bounding box 계산 → 빈 영역 잘라내기
      if (nodes.length > 0) {
        let minX = size, minY = size, maxX = 0, maxY = 0;
        for (const n of nodes) {
          if (n.x - n.r < minX) minX = n.x - n.r;
          if (n.y - n.r < minY) minY = n.y - n.r;
          if (n.x + n.r > maxX) maxX = n.x + n.r;
          if (n.y + n.r > maxY) maxY = n.y + n.r;
        }
        const pad = 12;
        const vbX = Math.max(0, minX - pad);
        const vbY = Math.max(0, minY - pad);
        const vbW = Math.min(size, maxX + pad - vbX);
        const vbH = Math.min(size, maxY + pad - vbY);
        viewBox = `${vbX.toFixed(2)} ${vbY.toFixed(2)} ${vbW.toFixed(2)} ${vbH.toFixed(2)}`;
        displayH = Math.round(size * vbH / vbW);
      }

      for (const n of nodes) {
        const color = getSubjectColor(n.data.subject);
        svgContent += `<circle cx="${n.x.toFixed(2)}" cy="${n.y.toFixed(2)}" r="${n.r.toFixed(2)}" fill="${color}"/>`;
        const subj = n.data.subject;
        const timeText = fmtDurationShort(n.data.seconds);
        if (n.r >= 32) {
          svgContent += `<text x="${n.x.toFixed(2)}" y="${(n.y - 8).toFixed(2)}" text-anchor="middle" dominant-baseline="middle" class="bubble-l">${escapeHtml(subj)}</text>`;
          svgContent += `<text x="${n.x.toFixed(2)}" y="${(n.y + 12).toFixed(2)}" text-anchor="middle" class="bubble-s">${escapeHtml(timeText)}</text>`;
        } else if (n.r >= 20) {
          svgContent += `<text x="${n.x.toFixed(2)}" y="${n.y.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" class="bubble-m">${escapeHtml(subj)}</text>`;
        } else if (n.r >= 14) {
          const short = subj.length > 4 ? subj.slice(0, 3) + '…' : subj;
          svgContent += `<text x="${n.x.toFixed(2)}" y="${n.y.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" class="bubble-xs">${escapeHtml(short)}</text>`;
        }
      }
    } else {
      // d3 미로드 폴백
      const cols = Math.ceil(Math.sqrt(sorted.length));
      const cellSize = size / cols;
      sorted.forEach(([subject, seconds], i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cx = col * cellSize + cellSize / 2;
        const cy = row * cellSize + cellSize / 2;
        const maxR = cellSize / 2 - 4;
        const r = maxR * Math.sqrt(seconds / sorted[0][1]);
        svgContent += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${getSubjectColor(subject)}"/>`;
      });
    }

    let html = `<div class="effort-pie-wrap">`;
    html += `<svg viewBox="${viewBox}" width="${size}" height="${displayH}" class="effort-bubble-svg">${svgContent}</svg>`;
    // 범례
    html += `<div class="effort-pie-legend">`;
    sorted.forEach(([subj, sec]) => {
      const pct = Math.round(sec / totalSec * 100);
      const color = getSubjectColor(subj);
      html += `
        <div class="effort-legend-row">
          <span class="effort-legend-color" style="background:${color};"></span>
          <span class="effort-legend-name">${escapeHtml(subj)}</span>
          <span class="effort-legend-val">${fmtDurationShort(sec)} (${pct}%)</span>
        </div>
      `;
    });
    html += `</div></div>`;
    return html;
  }

  window.submitEditEffortLog = function(id) {
    const subject = (document.getElementById('effortSubject')?.value || '').trim();
    const method = document.getElementById('effortMethod')?.value || '';
    const content = (document.getElementById('effortContent')?.value || '').trim();
    const reflection = (document.getElementById('effortReflection')?.value || '').trim();
    if (!subject) { alert('과목을 입력해주세요.'); return; }
    if (!content) { alert('공부 내용을 입력해주세요.'); return; }

    // 과목 자동완성 누적
    const subjects = loadEffortSubjects();
    if (!subjects.includes(subject)) {
      subjects.unshift(subject);
      saveEffortSubjects(subjects.slice(0, 20));
    }

    const logs = loadEffortLogs();
    const idx = logs.findIndex(l => l.id === id);
    if (idx < 0) { alert('기록을 찾을 수 없습니다.'); return; }
    logs[idx] = {
      ...logs[idx],
      subject, method, content, reflection,
      updatedAt: new Date().toISOString(),
    };
    saveEffortLogs(logs);

    closeEffortSaveModal();
    renderEffortContent();
    // Cloudinary 즉시 업로드 (사용자 명시적 수정)
